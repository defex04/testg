<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гроссбух мира — админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --ink:#12161F; --ink2:#181E2B; --panel:#1C2333; --line:#2A3147;
    --paper:#E9E1CD; --dim:#9A937F; --brass:#C9953F; --brass2:#E7BD6E;
    --credit:#7FBF7A; --debit:#E07A6A; --mono:"Cascadia Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--paper);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
  ::selection{background:var(--brass);color:var(--ink)}
  button{font:inherit;cursor:pointer;background:var(--panel);color:var(--paper);
         border:1px solid var(--line);border-radius:3px;padding:5px 12px}
  button:hover{border-color:var(--brass)}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--brass2);outline-offset:1px}
  button.brass{background:var(--brass);border-color:var(--brass);color:#1A1407;font-weight:600}
  button.danger{color:var(--debit);border-color:#5A3530}
  button.sm{padding:2px 8px;font-size:12px}
  input,select,textarea{background:var(--ink2);color:var(--paper);
    border:1px solid var(--line);border-radius:3px;padding:6px 9px;font:inherit}
  textarea{font-family:var(--mono);font-size:12.5px;width:100%}
  label{font-size:12px;color:var(--dim);display:block;margin-bottom:3px}

  #app{display:none;height:100%;grid-template-columns:208px 1fr;grid-template-rows:46px 1fr}
  aside{grid-row:1/3;background:var(--ink2);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  .wordmark{font-family:Georgia,'Times New Roman',serif;font-variant:small-caps;
    letter-spacing:.14em;font-size:19px;color:var(--brass2);
    padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .wordmark small{display:block;font:11px/1.4 var(--mono);letter-spacing:.08em;
    color:var(--dim);font-variant:normal}
  nav{padding:10px 0;overflow:auto}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;
    border-left:3px solid transparent;border-radius:0;padding:8px 18px;color:var(--dim)}
  nav button:hover{color:var(--paper)}
  nav button.active{color:var(--brass2);border-left-color:var(--brass);
    background:rgba(201,149,63,.07)}
  header{display:flex;align-items:center;gap:14px;padding:0 18px;
    border-bottom:1px solid var(--line);background:var(--ink2)}
  header h1{font-family:Georgia,serif;font-variant:small-caps;letter-spacing:.1em;
    font-size:16px;font-weight:600;margin:0}
  .stamp-env{font:11px var(--mono);letter-spacing:.18em;color:var(--brass2);
    border:1px solid var(--brass);padding:2px 8px;border-radius:2px}
  #hdr-online{margin-left:auto;font:12px var(--mono);color:var(--dim)}
  main{overflow:auto;padding:18px 22px 70px}

  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
  th{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    text-align:left;padding:7px 10px;border-bottom:1px solid var(--brass);white-space:nowrap}
  td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;
    font-variant-numeric:tabular-nums}
  tr.click:hover td{background:rgba(201,149,63,.06);cursor:pointer}
  .num{text-align:right}
  .credit{color:var(--credit)} .debit{color:var(--debit)} .muted{color:var(--dim)}
  .badge{font:11px var(--mono);padding:1px 7px;border:1px solid var(--line);border-radius:9px}
  .badge.live{color:var(--credit);border-color:#2E5132}
  .toolbar{display:flex;gap:10px;align-items:flex-end;margin:0 0 14px;flex-wrap:wrap}
  .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:12px 16px;min-width:148px;cursor:pointer;border-bottom:2px solid var(--line)}
  .card:hover{border-color:var(--brass)}
  .card b{display:block;font:600 22px var(--mono);color:var(--brass2)}
  .card span{font-size:12px;color:var(--dim)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:14px 16px;margin-bottom:16px}
  .panel h3{margin:0 0 10px;font-family:Georgia,serif;font-variant:small-caps;
    letter-spacing:.08em;font-weight:600;color:var(--brass2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .form .wide{grid-column:1/-1}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
  .bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    align-items:center;gap:4px;font:11px var(--mono);color:var(--dim);min-width:26px}
  .bars .bar i{display:block;width:100%;background:linear-gradient(180deg,var(--brass2),var(--brass));
    border-radius:2px 2px 0 0;min-height:2px}
  .bars .bar b{color:var(--paper);font-weight:400}
  .logline{font-family:var(--mono);font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .logline .turn{color:var(--brass2)}
  @media (max-width:900px){#app{grid-template-columns:64px 1fr}
    .wordmark{font-size:13px;padding:12px 8px}.wordmark small{display:none}
    nav button{padding:8px 10px;font-size:12px}
    .grid2{grid-template-columns:1fr}}

  /* Телефон: боковое меню превращается в верхнюю ленту, всё в одну колонку */
  @media (max-width:640px){
    #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
    aside{grid-row:auto;grid-column:1;flex-direction:row;align-items:stretch;
      border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
    aside .wordmark{display:none}
    nav{display:flex;flex-direction:row;padding:0;overflow-x:auto;width:100%}
    nav button{border-left:none;border-bottom:3px solid transparent;border-radius:0;
      white-space:nowrap;padding:11px 13px;font-size:13px}
    nav button.active{border-left:none;border-bottom-color:var(--brass);background:rgba(201,149,63,.07)}
    header{padding:0 12px;gap:8px}
    header h1{font-size:14px}
    .stamp-env{display:none}
    main{padding:12px 12px 64px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .grid2,.form{grid-template-columns:1fr}
    .cards{gap:8px}.card{min-width:0;flex:1 1 44%;padding:10px 12px}
    .card b{font-size:18px}
    .toolbar{gap:8px}.toolbar input,.toolbar select{flex:1 1 130px;min-width:0}
    table{font-size:11.5px}th,td{padding:5px 7px}
    #toast{left:12px;right:12px;bottom:12px;max-width:none}
  }

  #toast{position:fixed;right:22px;bottom:22px;background:var(--ink2);
    border:2px solid var(--brass);color:var(--brass2);
    font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;
    padding:10px 16px;border-radius:2px;transform:rotate(-1.2deg);
    opacity:0;transition:opacity .18s;pointer-events:none;max-width:360px}
  #toast.show{opacity:1}
  #toast.err{border-color:var(--debit);color:var(--debit)}
  @media (prefers-reduced-motion: reduce){#toast{transform:none;transition:none}}

  /* ── модалки: формы с выбором из списков вместо prompt()/confirm() ── */
  .modal-back{position:fixed;inset:0;background:rgba(8,10,16,.66);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:18px}
  .modal-card{background:var(--panel);border:1px solid var(--brass);border-radius:6px;
    width:430px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .modal-card.wide{width:780px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;border-bottom:1px solid var(--line);
    font-family:Georgia,serif;font-variant:small-caps;letter-spacing:.06em;color:var(--brass2)}
  .modal-x{background:none;border:none;color:var(--dim);font-size:16px;padding:2px 7px}
  .modal-x:hover{color:var(--paper)}
  .modal-body{padding:16px;overflow:auto}
  .m-form{display:flex;flex-direction:column;gap:13px}
  .m-field label{margin-bottom:4px}
  .m-field input,.m-field select,.m-field textarea{width:100%}
  .m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:2px}
  /* пикер «выбрать из списка» */
  .picker{position:relative}
  .picker-chip{margin-top:6px;font:12px var(--mono);color:var(--brass2)}
  .picker-chip:empty{display:none}
  .picker-drop{position:absolute;left:0;right:0;top:100%;margin-top:3px;z-index:5;
    background:var(--ink2);border:1px solid var(--brass);border-radius:4px;max-height:240px;
    overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .picker-drop.hide{display:none}
  .picker-opt{padding:7px 11px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
  .picker-opt:hover{background:rgba(201,149,63,.12)}
  .picker-opt small{color:var(--dim)}
  /* характеристики предмета — строки ключ/значение */
  .stat-row{display:grid;grid-template-columns:1fr 120px 32px;gap:8px;margin-bottom:7px;align-items:center}
  .stat-row .sx-del{padding:3px 0}
  /* 3D-превью модели */
  .model-preview{margin-top:10px;height:280px;border:1px solid var(--line);border-radius:4px;
    background:radial-gradient(circle at 50% 32%,#262f43,#11151e);position:relative;overflow:hidden}
  .model-preview canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  .model-preview canvas:active{cursor:grabbing}
  .mp-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font:12px var(--mono);text-align:center;padding:12px}
  .mp-hint.err{color:var(--debit)}
  .hdr-give{margin-left:6px}
  @media (max-width:640px){.modal-card,.modal-card.wide{width:100%}
    .stat-row{grid-template-columns:1fr 88px 30px}}

  #login{height:100%;display:flex;align-items:center;justify-content:center}
  #login form{background:var(--ink2);border:1px solid var(--line);border-radius:4px;
    padding:28px 30px;width:300px;text-align:center}
  #login .wordmark{border:none;padding:0 0 14px}
</style>
</head>
<body>

<div id="login" style="display:none">
  <form id="login-form">
    <div class="wordmark">Гроссбух мира<small>панель управления · local</small></div>
    <input id="login-pass" type="password" placeholder="Пароль администратора"
           style="width:100%;margin-bottom:10px" autofocus>
    <button class="brass" style="width:100%">Открыть книгу</button>
    <div id="login-err" class="debit" style="margin-top:8px;font-size:12px"></div>
  </form>
</div>

<div id="app">
  <aside>
    <div class="wordmark">Гроссбух мира<small>mmo_game · mmo_auth · redis</small></div>
    <nav id="nav"></nav>
  </aside>
  <header><h1 id="hdr-title"></h1>
    <button class="brass sm hdr-give" type="button" onclick="grant()">+ Выдать</button>
    <span class="stamp-env">LOCAL</span><span id="hdr-online"></span></header>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt = (v) => v ? new Date(v).toLocaleString('ru-RU',
  {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

let KEY = sessionStorage.getItem('adminKey') || '';

async function api(path, body){
  const r = await fetch('/admin/api' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: {'Content-Type':'application/json','x-admin-key':KEY},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401){ logout(); throw new Error('нужен вход'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}
async function upload(file){
  const r = await fetch('/admin/api/upload?name=' + encodeURIComponent(file.name),
    { method:'POST', headers:{'x-admin-key':KEY}, body:file });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d.url;
}

let toastT = null;
function stamp(text, err = false){
  const t = $('#toast');
  t.textContent = text; t.className = err ? 'err show' : 'show';
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
const ok = (t) => stamp('Проведено · ' + t);
const fail = (e) => stamp('Отказано · ' + e.message, true);

/* ===================================================================== *
 *  Модалки и пикеры: вместо prompt()/confirm() — формы с выбором из
 *  списков (игрок, предмет), выпадашками валют/локаций и т.п.
 * ===================================================================== */
function modalKey(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  const m = $('#modal'); if (!m) return;
  m.remove(); document.removeEventListener('keydown', modalKey);
}
function openModal(title, bodyHTML, { wide = false } = {}){
  closeModal();
  const back = document.createElement('div');
  back.id = 'modal'; back.className = 'modal-back';
  back.innerHTML = `<div class="modal-card${wide ? ' wide' : ''}">
    <div class="modal-head"><span>${esc(title)}</span>
      <button class="modal-x" type="button" aria-label="Закрыть">✕</button></div>
    <div class="modal-body">${bodyHTML}</div></div>`;
  back.addEventListener('mousedown', (e) => { if (e.target === back) closeModal(); });
  back.querySelector('.modal-x').onclick = closeModal;
  document.body.appendChild(back);
  document.addEventListener('keydown', modalKey);
  return back.querySelector('.modal-card');
}

let _locs = null;
const locationsCached = async () => (_locs ||= await api('/locations'));

/* HTML одного поля формы по описанию { key, label, type, value, ... } */
function fieldHTML(f){
  const id = 'mf-' + f.key, v = f.value ?? '';
  let ctrl;
  switch (f.type){
    case 'number':
      ctrl = `<input id="${id}" type="number" ${f.step ? `step="${f.step}"` : ''} value="${esc(v)}">`; break;
    case 'textarea':
      ctrl = `<textarea id="${id}" rows="${f.rows || 3}">${esc(v)}</textarea>`; break;
    case 'checkbox':
      ctrl = `<select id="${id}"><option value="1" ${v ? 'selected' : ''}>да</option>
        <option value="0" ${!v ? 'selected' : ''}>нет</option></select>`; break;
    case 'select':
      ctrl = `<select id="${id}">${opt(f.options, v, f.empty)}</select>`; break;
    case 'currency':
      ctrl = `<select id="${id}">${opt(D.currency, v || 'copper')}</select>`; break;
    case 'location':
      ctrl = `<select id="${id}"><option>загрузка…</option></select>`; break;
    case 'player': case 'item':
      ctrl = `<div class="picker" data-kind="${f.type}">
        <input id="${id}-q" autocomplete="off" placeholder="${
          f.type === 'player' ? 'имя или ID игрока…' : 'название или ID предмета…'}">
        <input id="${id}" type="hidden" value="${esc(v)}">
        <div class="picker-drop hide" id="${id}-drop"></div>
        <div class="picker-chip" id="${id}-chip"></div></div>`; break;
    default:
      ctrl = `<input id="${id}" value="${esc(v)}">`;
  }
  return `<div class="m-field" data-key="${esc(f.key)}">
    <label for="${id}">${esc(f.label || f.key)}</label>${ctrl}
    ${f.help ? `<div class="muted" style="font-size:11px;margin-top:4px">${esc(f.help)}</div>` : ''}</div>`;
}

async function wireField(card, f){
  if (f.type === 'location'){
    const sel = card.querySelector('#mf-' + f.key);
    try {
      const locs = await locationsCached();
      sel.innerHTML = locs.map((l) =>
        `<option value="${l.id}" ${String(f.value) === String(l.id) ? 'selected' : ''}>${
          esc(l.name)} #${l.id}</option>`).join('');
    } catch { sel.innerHTML = '<option value="">— ошибка загрузки —</option>'; }
  }
  if (f.type === 'player' || f.type === 'item') setupPicker(card, f);
}

/* живой поиск + выбор из выпадающего списка (игрок / предмет) */
function setupPicker(card, f){
  const q = card.querySelector('#mf-' + f.key + '-q');
  const hidden = card.querySelector('#mf-' + f.key);
  const drop = card.querySelector('#mf-' + f.key + '-drop');
  const chip = card.querySelector('#mf-' + f.key + '-chip');
  let timer = null;
  const fmt = (r) => f.type === 'player'
    ? `${esc(r.name)} <small>#${r.id} · ур.${r.level} · ${esc(r.location || '')}</small>`
    : `${esc(r.name)} <small>#${r.id} · ${dict(D.itemType, r.type)}</small>`;
  const chosen = (id, name) => {
    chip.innerHTML = `выбрано: <b>${esc(name)}</b> #${id} ` +
      `<button type="button" class="sm px-clear">сменить</button>`;
    chip.querySelector('.px-clear').onclick = () => { hidden.value = ''; chip.textContent = ''; q.focus(); };
  };
  const pick = (r) => { hidden.value = r.id; q.value = ''; drop.classList.add('hide'); drop.innerHTML = '';
    chosen(r.id, r.name); };
  const search = async () => {
    const term = q.value.trim();
    if (!term){ drop.classList.add('hide'); drop.innerHTML = ''; return; }
    try {
      const rows = await api((f.type === 'player' ? '/characters?q=' : '/item-templates?q=')
        + encodeURIComponent(term));
      const top = rows.slice(0, 12);
      drop.innerHTML = top.length
        ? top.map((r, i) => `<div class="picker-opt" data-i="${i}">${fmt(r)}</div>`).join('')
        : '<div class="picker-opt muted">ничего не найдено</div>';
      drop.classList.remove('hide');
      top.forEach((r, i) => {
        const el = drop.querySelector(`[data-i="${i}"]`); if (el) el.onclick = () => pick(r);
      });
    } catch (e) {
      drop.innerHTML = `<div class="picker-opt debit">ошибка: ${esc(e.message)}</div>`;
      drop.classList.remove('hide');
    }
  };
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 220); });
  q.addEventListener('focus', () => { if (q.value.trim()) search(); });
  // клик вне списка прячет выпадашку; слушатель на карточке — уйдёт с модалкой
  card.addEventListener('mousedown', (e) => {
    if (!drop.contains(e.target) && e.target !== q) drop.classList.add('hide');
  });
  if (f.value) chosen(f.value, '#' + f.value);   // предвыбор при редактировании
}

function readField(card, f){
  const el = card.querySelector('#mf-' + f.key);
  if (!el) return null;
  if (f.type === 'number') return el.value === '' ? null : +el.value;
  if (f.type === 'checkbox') return el.value === '1';
  if (f.type === 'player' || f.type === 'item') return el.value === '' ? null : +el.value;
  return el.value;
}

/* Готовая форма-модалка: возвращает {значения} или null (отмена/закрытие). */
function formModal({ title, fields, submit = 'Провести', wide = false }){
  return new Promise((resolve) => {
    const card = openModal(title, `<form id="m-form" class="m-form">
      ${fields.map(fieldHTML).join('')}
      <div class="m-actions">
        <button type="button" class="m-cancel">Отмена</button>
        <button type="submit" class="brass">${esc(submit)}</button></div></form>`, { wide });
    let done = false;
    fields.forEach((f) => wireField(card, f));
    card.querySelector('.m-cancel').onclick = () => { done = true; closeModal(); resolve(null); };
    card.querySelector('#m-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const out = {};
      for (const f of fields){
        const v = readField(card, f);
        if (f.required && (v === '' || v == null))
          return stamp('Заполните: ' + (f.label || f.key), true);
        out[f.key] = v;
      }
      done = true; closeModal(); resolve(out);
    });
    const obs = new MutationObserver(() => {     // закрыли крестиком/фоном/Esc → null
      if (!document.body.contains(card) && !done){ done = true; obs.disconnect(); resolve(null); }
    });
    obs.observe(document.body, { childList: true });
  });
}

/* ── Ленивая загрузка three.js (из CDN) для 3D-превью моделей ── */
let _three = null;
async function loadThree(){
  if (_three) return _three;
  const base = 'https://esm.sh/three@0.160.0';
  const THREE = await import(base);
  const [{ GLTFLoader }, { FBXLoader }] = await Promise.all([
    import(base + '/examples/jsm/loaders/GLTFLoader.js'),
    import(base + '/examples/jsm/loaders/FBXLoader.js'),
  ]);
  _three = { THREE, GLTFLoader, FBXLoader };
  return _three;
}
let _preview = null;
function disposePreview(){ if (_preview){ try { _preview.dispose(); } catch {} _preview = null; } }
const modelExt = (s) => String(s || '').split('?')[0].split('.').pop().toLowerCase();

async function mountModelPreview(host, src, ext){
  disposePreview();
  if (!host) return;
  host.innerHTML = '<div class="mp-hint">Загрузка 3D-движка…</div>';
  let M;
  try { M = await loadThree(); }
  catch { host.innerHTML = '<div class="mp-hint err">3D-превью недоступно: нет доступа к CDN three.js</div>'; return; }
  const { THREE, GLTFLoader, FBXLoader } = M;
  host.innerHTML = '<div class="mp-hint">Загрузка модели…</div>';
  let obj;
  try {
    if (ext === 'fbx') obj = await new FBXLoader().loadAsync(src);
    else { const g = await new GLTFLoader().loadAsync(src); obj = g.scene; }
  } catch (e) {
    host.innerHTML = `<div class="mp-hint err">Не удалось загрузить модель: ${esc(e.message || 'ошибка')}</div>`;
    return;
  }
  host.innerHTML = '';
  const w = host.clientWidth || 420, h = host.clientHeight || 280;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, w / h, 0.01, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x33373f, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(2, 4, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(-3, 2, -4); scene.add(rim);
  const pivot = new THREE.Group(); scene.add(pivot);
  // нормализация: центр в 0, наибольший габарит → 2 единицы
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxD = Math.max(size.x, size.y, size.z) || 1;
  obj.position.sub(center); obj.scale.setScalar(2 / maxD); pivot.add(obj);
  camera.position.set(0, 0.3, 4); camera.lookAt(0, 0, 0);
  let drag = false, lx = 0, ly = 0, auto = true;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (e) => { drag = true; auto = false; lx = e.clientX; ly = e.clientY;
    el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (!drag) return;
    pivot.rotation.y += (e.clientX - lx) * 0.01; pivot.rotation.x += (e.clientY - ly) * 0.01;
    lx = e.clientX; ly = e.clientY; });
  const stop = () => { drag = false; };
  el.addEventListener('pointerup', stop); el.addEventListener('pointercancel', stop);
  let raf = 0; const clock = new THREE.Clock();
  const tick = () => { raf = requestAnimationFrame(tick);
    const dt = clock.getDelta(); if (auto) pivot.rotation.y += dt * 0.6;
    renderer.render(scene, camera); };
  tick();
  _preview = { dispose(){ cancelAnimationFrame(raf); renderer.dispose(); renderer.domElement.remove(); } };
}

function table(cols, rows, rowAttr){
  if (!rows.length) return '<p class="muted">Записей нет — книга на этой странице пуста.</p>';
  return `<table><thead><tr>${cols.map((c)=>`<th>${c.h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r)=>`<tr ${rowAttr ? rowAttr(r) : ''}>${
    cols.map((c)=>c.html ? c.html(r) : `<td>${esc(c.v(r))}</td>`).join('')
  }</tr>`).join('')}</tbody></table>`;
}
function barChart(rows, labelKey, valueKey){
  if (!rows.length) return '<p class="muted">Данных пока нет.</p>';
  const max = Math.max(...rows.map((r) => +r[valueKey]), 1);
  return `<div class="bars">${rows.map((r)=>`
    <div class="bar"><b>${r[valueKey]}</b>
      <i style="height:${Math.round(100 * r[valueKey] / max)}%"></i>
      <span>${esc(r[labelKey])}</span></div>`).join('')}</div>`;
}

/* Флагман: «Выдать игроку» — выбор игрока из списка + предмет ИЛИ валюта,
   с переключателем. Доступно из шапки и со страницы персонажа (preset). */
window.grant = async (presetCharId) => {
  const F = {
    player: { key:'character_id', label:'Игрок', type:'player', value: presetCharId || '' },
    kind:   { key:'kind', label:'Что выдать', type:'select', options:{ item:'Предмет', currency:'Валюта' }, value:'item' },
    item:   { key:'template_id', label:'Предмет', type:'item' },
    qty:    { key:'quantity', label:'Количество', type:'number', value:1 },
    code:   { key:'code', label:'Валюта', type:'currency', value:'copper' },
    amount: { key:'amount', label:'Сумма', type:'number', value:100 },
    note:   { key:'note', label:'Основание (в аудит)', type:'text' },
  };
  const card = openModal('Выдать игроку', `<form id="m-form" class="m-form">
    ${fieldHTML(F.player)}${fieldHTML(F.kind)}
    <div data-grp="item">${fieldHTML(F.item)}${fieldHTML(F.qty)}</div>
    <div data-grp="currency" style="display:none">${fieldHTML(F.code)}${fieldHTML(F.amount)}</div>
    ${fieldHTML(F.note)}
    <div class="m-actions"><button type="button" class="m-cancel">Отмена</button>
      <button type="submit" class="brass">Выдать</button></div></form>`);
  Object.values(F).forEach((f) => wireField(card, f));
  const sync = () => { const k = card.querySelector('#mf-kind').value;
    card.querySelector('[data-grp="item"]').style.display = k === 'item' ? '' : 'none';
    card.querySelector('[data-grp="currency"]').style.display = k === 'currency' ? '' : 'none'; };
  card.querySelector('#mf-kind').addEventListener('change', sync); sync();
  card.querySelector('.m-cancel').onclick = closeModal;
  card.querySelector('#m-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const charId = readField(card, F.player);
    if (!charId) return stamp('Выберите игрока', true);
    try {
      if (readField(card, F.kind) === 'item'){
        const tpl = readField(card, F.item); if (!tpl) return stamp('Выберите предмет', true);
        const r = await api(`/characters/${charId}/give-item`,
          { template_id: tpl, quantity: readField(card, F.qty) || 1 });
        ok('выдан предмет #' + r.itemId);
      } else {
        const amount = readField(card, F.amount); if (!amount) return stamp('Укажите сумму', true);
        const r = await api(`/characters/${charId}/currency`,
          { code: readField(card, F.code), amount, note: readField(card, F.note) || null });
        ok('баланс ' + r.balance);
      }
      closeModal();
      if (current === 'chars' && document.querySelector('h2')) openChar(charId);
    } catch (err) { fail(err); }
  });
};

window.openBattle = async (id) => {
  const d = await api('/battles/' + id);
  const names = Object.fromEntries(d.participants.map((p) => [p.character_id, p.name]));
  const npc = (d.battle.meta || {}).npcName || 'Противник';
  const nm = (cid) => cid ? (names[cid] || '#' + cid) : npc;
  const line = (r) => {
    const a = nm(r.actor_id), t = nm(r.target_id);
    const z = dict(D.zone, (r.effects || {}).zone);
    switch (r.action_type) {
      case 1: return `<b>${esc(a)}</b> бьёт <b>${esc(t)}</b> в ${z} — <b>${r.value}</b>`;
      case 2: return `<b>${esc(t)}</b> блокирует удар <b>${esc(a)}</b> в ${z} — лишь <b>${r.value}</b>`;
      case 3: return `<b>${esc(t)}</b> уворачивается от удара <b>${esc(a)}</b>`;
      case 4: return `<b>${esc(a)}</b> бьёт <b>${esc(t)}</b> в ${z} — <span class="debit">КРИТ ${r.value}</span>`;
      case 5: return `<span class="debit"><b>${esc(t)}</b> погибает</span>`;
      case 6: return `<b>${esc(a)}</b> применяет способность на <b>${esc(t)}</b>`;
      default: return `действие ${r.action_type}`;
    }
  };
  let log = '', lastTurn = 0;
  for (const r of d.rounds) {
    if (r.round_no !== lastTurn) {
      lastTurn = r.round_no;
      log += `<div class="logline"><span class="turn">— Ход ${r.round_no} —</span></div>`;
    }
    log += `<div class="logline">${line(r)}</div>`;
  }
  $('#main').innerHTML = `
  <div class="toolbar"><button onclick="show('battles')">← К списку</button>
    <h2 style="margin:0;font-family:Georgia,serif;font-variant:small-caps">Бой #${id}
      <span class="muted">· ${dict(D.bType,d.battle.type)} · ${dict(D.bStatus,d.battle.status)}</span></h2>
    ${d.battle.status === 2 || d.battle.status === 1
      ? `<button class="brass" onclick="toggleIntervention(${id}, ${d.battle.intervention !== 1})">
           ${d.battle.intervention === 1 ? 'Закрыть вмешательство' : 'Открыть вмешательство'}</button>
         <button class="danger" onclick="abortBattle(${id})">Прервать бой</button>` : ''}</div>
  <div class="panel"><h3>Участники</h3>
    ${table([{h:'Сторона',v:r=>r.side},{h:'Имя',v:r=>r.name},
      {h:'Итог',v:r=>dict(D.result,r.result)},{h:'Урон',v:r=>r.damage_dealt},
      {h:'Опыт',v:r=>r.exp_gained}], d.participants)}</div>
  <div class="panel"><h3>Журнал боя</h3>${log || '<p class="muted">Ходов ещё не было.</p>'}</div>`;
};
window.abortBattle = async (id) => {
  if (!confirm('Прервать бой #' + id + '? Награды не начислятся.')) return;
  // тело {} обязательно: api() без тела шлёт GET, а маршрут принимает POST
  try { await api(`/battles/${id}/abort`, {}); ok('бой #' + id + ' прерван'); openBattle(id); }
  catch (e) {
    fail(e.message === 'battle_not_active'
      ? new Error('бой #' + id + ' уже завершён или прерван') : e);
    openBattle(id);   // показать актуальный статус
  }
};

/* характеристики предмета — произвольные пары ключ→значение (число/true/false) */
const STAT_KEYS = {
  defense:'Защита', strength:'Сила', hp:'Здоровье', crit:'Крит (доля 0–1)',
  dodge:'Уворот (доля 0–1)', mp:'Мана', energy:'Энергия',
  heal:'Лечение (эликсир)', power_mult:'Множитель урона (эликсир)',
  power_turns:'Ходов усиления', escape:'Эликсир побега (true)',
};
let _modelFile = null;   // выбранный, но ещё не загруженный файл модели
function statRowHTML(key = '', val = ''){
  return `<div class="stat-row">
    <input class="sx-key" list="stat-keys" placeholder="ключ (hp, defense…)" value="${esc(key)}">
    <input class="sx-val" placeholder="значение" value="${esc(val)}">
    <button type="button" class="sm danger" title="убрать"
      onclick="this.closest('.stat-row').remove()">✕</button></div>`;
}
window.addStatRow = (k = '', v = '') =>
  $('#stat-rows').insertAdjacentHTML('beforeend', statRowHTML(k, v));
function collectStats(){
  const out = {};
  document.querySelectorAll('#stat-rows .stat-row').forEach((row) => {
    const k = row.querySelector('.sx-key').value.trim(); if (!k) return;
    const raw = row.querySelector('.sx-val').value.trim();
    out[k] = raw === 'true' ? true : raw === 'false' ? false
      : (raw !== '' && !isNaN(Number(raw))) ? Number(raw) : raw;
  });
  return out;
}

  <div class="grid2">
    <div class="panel"><h3>Шаблон</h3><div class="form">
      <div><label>Уникальный ID</label><input id="t-id" type="number" value="${t.id}" ${r?'disabled':''}></div>
      <div class="wide"><label>Название</label><input id="t-name" value="${esc(t.name)}" style="width:100%"></div>
      <div><label>Тип</label><select id="t-type">${opt(D.itemType, t.type)}</select></div>
      <div><label>Слот (для брони)</label><select id="t-slot">${opt(D.slot, t.slot, '— не надевается')}</select></div>
      <div><label>Качество 1–5</label><input id="t-q" type="number" value="${t.quality}"></div>

      <div><label>Стакуется</label><select id="t-stack">
        <option value="0" ${!t.stackable?'selected':''}>нет</option>
        <option value="1" ${t.stackable?'selected':''}>да</option></select></div>
      <div><label>Макс. стак</label><input id="t-maxstack" type="number" value="${t.max_stack||1}"></div>
    </div>
    <h3 style="margin-top:14px">Характеристики
      <button type="button" class="sm" style="margin-left:8px" onclick="addStatRow()">+ строка</button></h3>
    <div id="stat-rows">${rows}</div>
    <p class="muted" style="font-size:11px;margin-top:2px">Любые пары ключ→значение
      (число, true/false). Сервер сольёт их в base_stats предмета.</p>
    <h3 style="margin-top:14px">Требования, чтобы надеть</h3><div class="form">
      <div><label>Мин. уровень</label><input id="r-lvl" type="number" value="${rq.level ?? t.level_req ?? 1}"></div>

            placeholder="/uploads/… или ключ из content.js" style="width:100%"></div>

    </div>
  </div>`;
  $('#t-model-file').addEventListener('change', (e) => {

    mountModelPreview($('#t-preview'), URL.createObjectURL(f), modelExt(f.name));

  const rows = await api('/quests');
  return `<div class="toolbar"><button class="brass" onclick="editQuest()">Новое задание</button>
    <span class="muted">Задания отслеживаются у игроков автоматически; награда приходит сразу.</span></div>
  ${table([
    {h:'ID',v:r=>r.id},{h:'Название',v:r=>r.name},
    {h:'Вкл',html:r=>`<td>${r.active?'<span class="credit">да</span>':'<span class="muted">нет</span>'}</td>`},
    {h:'Уровень',v:r=>r.level_req},{h:'Повтор',v:r=>dict(D.rep,r.repeatable)},
    {h:'Цель',v:r=>`побед в охоте: ${(r.objectives||{}).count ?? 1}`},
    {h:'Награда',v:r=>{const w=r.rewards||{};return [w.copper&&w.copper+' меди',
      w.exp&&w.exp+' опыта',(w.items||[]).length&&'предметы'].filter(Boolean).join(', ')||'—';}},
    {h:'Выполнили',v:r=>r.completed_by},
  ], rows, (r)=>`class="click" onclick="openQuest(${r.id})"`)}`;

window.openQuest = async (id) => {
  const rows = await api('/quests');
  editQuest(rows.find((x) => x.id === id));
};
window.editQuest = (r) => {
  const q = r || { id:'', name:'', description:'', image:'', level_req:1,
    repeatable:2, active:true, objectives:{kind:'hunt_wins',count:3},
    rewards:{copper:100,exp:200,items:[]} };
  const w = q.rewards || {};
  $('#main').innerHTML = `
  <div class="toolbar"><button onclick="show('quests')">← К списку</button>
    <h2 style="margin:0;font-family:Georgia,serif;font-variant:small-caps">
      ${r ? 'Задание #' + q.id : 'Новое задание'}</h2></div>
  <div class="panel"><div class="form">
    <div><label>Уникальный ID</label><input id="q-id" type="number" value="${q.id}" ${r?'disabled':''}></div>
    <div class="wide"><label>Название</label><input id="q-name" value="${esc(q.name)}" style="width:100%"></div>
    <div class="wide"><label>Описание (видно игроку)</label>
      <textarea id="q-desc" rows="3">${esc(q.description||'')}</textarea></div>
    <div><label>Мин. уровень</label><input id="q-lvl" type="number" value="${q.level_req}"></div>
    <div><label>Повторяемость</label><select id="q-rep">${opt(D.rep, q.repeatable)}</select></div>
    <div><label>Включено</label><select id="q-active">
      <option value="1" ${q.active?'selected':''}>да</option>
      <option value="0" ${!q.active?'selected':''}>нет</option></select></div>
    <div><label>Цель: побед в охоте</label>
      <input id="q-count" type="number" value="${(q.objectives||{}).count ?? 1}"></div>
    <div><label>Награда: медь</label><input id="q-copper" type="number" value="${w.copper ?? 0}"></div>
    <div><label>Награда: опыт</label><input id="q-exp" type="number" value="${w.exp ?? 0}"></div>
    <div class="wide"><label>Награда: ID предметов через запятую</label>
      <input id="q-items" value="${esc((w.items||[]).join(', '))}" style="width:100%"></div>
    <div class="wide"><label>Картинка</label>
      <input id="q-file" type="file" accept="image/*">
      <input id="q-image" value="${esc(q.image||'')}" placeholder="/uploads/..." style="width:60%">
      ${q.image ? `<div style="margin-top:8px"><img src="${esc(q.image)}"
        style="max-height:110px;border:1px solid var(--line);border-radius:3px"></div>` : ''}</div>
  </div>
  <div class="toolbar" style="margin-top:12px">
    <button class="brass" onclick="saveQuest()">Сохранить задание</button></div></div>`;
  $('#q-file').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { $('#q-image').value = await upload(f); ok('картинка загружена'); }
    catch (err) { fail(err); }
  });
};
window.saveQuest = async () => {
  const body = {
    id: +$('#q-id').value, name: $('#q-name').value.trim(),
    description: $('#q-desc').value.trim(), image: $('#q-image').value.trim() || null,
    level_req: +$('#q-lvl').value || 1, repeatable: +$('#q-rep').value,
    active: $('#q-active').value === '1',
    objectives: { kind: 'hunt_wins', count: +$('#q-count').value || 1 },
    rewards: { copper: +$('#q-copper').value || 0, exp: +$('#q-exp').value || 0,
      items: $('#q-items').value.split(',').map((s)=>+s.trim()).filter(Boolean) },
  };
  if (!body.id || !body.name) return stamp('Отказано · нужны ID и название', true);
  try { await api('/quests', body); ok('задание #' + body.id); show('quests'); }
  catch (e) { fail(e); }
};

/* ================= Конфиг: живой баланс без деплоя ================= */
const CFG_FORMS = {
  'battle.turn_time': { title: 'Время хода в бою, секунд',
    render: (v) => `<input data-k="0" type="number" value="${v}">`,
    collect: (g) => +g(0) },
  'battle.reward.hunt': { title: 'Награда за победу в охоте',
    render: (v) => `<div><label>Меди</label><input data-k="0" type="number" value="${v.amount}"></div>
      <div><label>Опыта</label><input data-k="1" type="number" value="${v.exp}"></div>`,
    collect: (g) => ({ currency: 'copper', amount: +g(0), exp: +g(1) }) },
  'battle.escape_elixir': { title: 'ID шаблона Эликсира побега',
    render: (v) => `<input data-k="0" type="number" value="${v}">`,
    collect: (g) => +g(0) },
  'character.start': { title: 'Стартовый персонаж',
    render: (v) => `<div><label>Уровень</label><input data-k="0" type="number" value="${v.level}"></div>
      <div><label>HP</label><input data-k="1" type="number" value="${v.hp}"></div>
      <div><label>Урон от</label><input data-k="2" type="number" value="${v.damage[0]}"></div>
      <div><label>Урон до</label><input data-k="3" type="number" value="${v.damage[1]}"></div>
      <div><label>Крит (0–1)</label><input data-k="4" type="number" step="0.01" value="${v.crit}"></div>
      <div><label>Уворот (0–1)</label><input data-k="5" type="number" step="0.01" value="${v.dodge}"></div>`,
    collect: (g, old) => ({ ...old, level:+g(0), hp:+g(1),
      damage:[+g(2), +g(3)], crit:+g(4), dodge:+g(5) }) },
  'chat.history_limit': { title: 'Сколько сообщений чата отдавать при входе',
    render: (v) => `<input data-k="0" type="number" value="${v}">`,
    collect: (g) => +g(0) },
};
let CFG_RAW = {};
R.config = async () => {
  const rows = await api('/config');
  CFG_RAW = Object.fromEntries(rows.map((r) => [r.key, r.value]));
  return `<div class="panel"><h3>Что это</h3>
    <p class="muted" style="margin:0">Конфиг — живой баланс игры: цифры, которые сервер
    читает из базы, а не из кода. Поменял значение → «Сохранить» → сервер подхватил
    сразу, без пересборки и перезапуска. Каждое изменение попадает в аудит.</p></div>
  ${rows.map((r) => {
    const f = CFG_FORMS[r.key];
    const body = f
      ? `<div class="form" data-key="${esc(r.key)}">${f.render(r.value)}</div>`
      : `<textarea rows="2" data-key="${esc(r.key)}" data-json>${esc(JSON.stringify(r.value))}</textarea>`;
    return `<div class="panel"><h3>${f ? f.title : r.key}
        <span class="muted" style="font-size:11px">· ${esc(r.key)} · v${r.version}</span></h3>
      ${body}
      <div class="toolbar" style="margin-top:10px">
        <button class="brass" onclick="saveCfg('${esc(r.key)}')">Сохранить</button>
        <span class="muted">изменён: ${dt(r.updated_at)}</span></div></div>`;
  }).join('')}`;
};
window.saveCfg = async (key) => {
  const f = CFG_FORMS[key];
  let value;
  if (f) {
    const box = document.querySelector(`[data-key="${key}"]`);
    const g = (i) => box.querySelector(`[data-k="${i}"]`).value;
    value = f.collect(g, CFG_RAW[key]);
  } else {
    try { value = JSON.parse(document.querySelector(`[data-key="${key}"][data-json]`).value); }
    catch { return stamp('Отказано · это не JSON', true); }
  }
  try { await api('/config', { key, value }); ok('config ' + key); }
  catch (e) { fail(e); }
};

/* ================= навигация и вход ================= */
window.show = async (name, arg) => {
  current = name;
  disposePreview();   // уходим со страницы предмета — гасим 3D-цикл превью
  document.querySelectorAll('#nav button').forEach((b) =>
    b.classList.toggle('active', b.dataset.s === name));
  $('#hdr-title').textContent = SECTIONS.find(([k]) => k === name)[1];
  $('#main').innerHTML = '<p class="muted">Листаем книгу…</p>';
  try { $('#main').innerHTML = await R[name](arg); }
  catch (e) { $('#main').innerHTML =
    `<p class="debit">Не удалось загрузить: ${esc(e.message)}</p>`; }
};
$('#nav').innerHTML = SECTIONS.map(([k, t]) =>
  `<button data-s="${k}" onclick="show('${k}')">${t}</button>`).join('');

function logout(){
  KEY = ''; sessionStorage.removeItem('adminKey');
  $('#app').style.display = 'none'; $('#login').style.display = 'flex';
}
async function enter(){
  $('#login').style.display = 'none'; $('#app').style.display = 'grid';
  show('stats');
  setInterval(() => { if (current === 'stats') show('stats'); }, 15000);
}
$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  KEY = $('#login-pass').value;
  try { await api('/login', { password: KEY });
    sessionStorage.setItem('adminKey', KEY); enter(); }
  catch (err) { $('#login-err').textContent =
    err.message === 'admin_disabled'
      ? 'Админка выключена: задай ADMIN_PASSWORD в .env'
      : 'Пароль не подходит'; }
});

/** Вход через Telegram (без пароля): initData из WebApp ИЛИ из hash (#tginit),
 *  когда перешли из игры. Меняем подпись на токен-ключ. */
async function tryTelegramLogin(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg){ try { tg.ready(); tg.expand(); } catch (e) {} }
  const fromHash = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('tginit');
  const initData = (tg && tg.initData) || fromHash || '';
  if (!initData) return false;
  try {
    const r = await fetch('/admin/api/telegram-login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.key){
      KEY = d.key; sessionStorage.setItem('adminKey', KEY);
      history.replaceState(null, '', location.pathname);   // убрать initData из URL
      return true;
    }
  } catch (e) {}
  return false;
}

// Старт: вход через Telegram (initData/hash); иначе сохранённый ключ; иначе форма.
(async () => {
  if (await tryTelegramLogin()){ enter(); return; }
  if (KEY){ try { await api('/stats'); enter(); return; } catch (e) {} }
  logout();
})();
</script>
