<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гроссбух мира — админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --ink:#12161F; --ink2:#181E2B; --panel:#1C2333; --line:#2A3147;
    --paper:#E9E1CD; --dim:#9A937F; --brass:#C9953F; --brass2:#E7BD6E;
    --credit:#7FBF7A; --debit:#E07A6A; --mono:"Cascadia Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--paper);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
  ::selection{background:var(--brass);color:var(--ink)}
  button{font:inherit;cursor:pointer;background:var(--panel);color:var(--paper);
         border:1px solid var(--line);border-radius:3px;padding:5px 12px}
  button:hover{border-color:var(--brass)}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--brass2);outline-offset:1px}
  button.brass{background:var(--brass);border-color:var(--brass);color:#1A1407;font-weight:600}
  button.danger{color:var(--debit);border-color:#5A3530}
  button.sm{padding:2px 8px;font-size:12px}
  input,select,textarea{background:var(--ink2);color:var(--paper);
    border:1px solid var(--line);border-radius:3px;padding:6px 9px;font:inherit}
  textarea{font-family:var(--mono);font-size:12.5px;width:100%}
  label{font-size:12px;color:var(--dim);display:block;margin-bottom:3px}

  #app{display:none;height:100%;grid-template-columns:208px 1fr;grid-template-rows:46px 1fr}
  aside{grid-row:1/3;background:var(--ink2);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  .wordmark{font-family:Georgia,'Times New Roman',serif;font-variant:small-caps;
    letter-spacing:.14em;font-size:19px;color:var(--brass2);
    padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .wordmark small{display:block;font:11px/1.4 var(--mono);letter-spacing:.08em;
    color:var(--dim);font-variant:normal}
  nav{padding:10px 0;overflow:auto}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;
    border-left:3px solid transparent;border-radius:0;padding:8px 18px;color:var(--dim)}
  nav button:hover{color:var(--paper)}
  nav button.active{color:var(--brass2);border-left-color:var(--brass);
    background:rgba(201,149,63,.07)}
  header{display:flex;align-items:center;gap:14px;padding:0 18px;
    border-bottom:1px solid var(--line);background:var(--ink2)}
  header h1{font-family:Georgia,serif;font-variant:small-caps;letter-spacing:.1em;
    font-size:16px;font-weight:600;margin:0}
  .stamp-env{font:11px var(--mono);letter-spacing:.18em;color:var(--brass2);
    border:1px solid var(--brass);padding:2px 8px;border-radius:2px}
  #hdr-online{margin-left:auto;font:12px var(--mono);color:var(--dim)}
  main{overflow:auto;padding:18px 22px 70px}

  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
  th{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    text-align:left;padding:7px 10px;border-bottom:1px solid var(--brass);white-space:nowrap}
  td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;
    font-variant-numeric:tabular-nums}
  tr.click:hover td{background:rgba(201,149,63,.06);cursor:pointer}
  .num{text-align:right}
  .credit{color:var(--credit)} .debit{color:var(--debit)} .muted{color:var(--dim)}
  .badge{font:11px var(--mono);padding:1px 7px;border:1px solid var(--line);border-radius:9px}
  .badge.live{color:var(--credit);border-color:#2E5132}
  .toolbar{display:flex;gap:10px;align-items:flex-end;margin:0 0 14px;flex-wrap:wrap}
  .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:12px 16px;min-width:148px;cursor:pointer;border-bottom:2px solid var(--line)}
  .card:hover{border-color:var(--brass)}
  .card b{display:block;font:600 22px var(--mono);color:var(--brass2)}
  .card span{font-size:12px;color:var(--dim)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:14px 16px;margin-bottom:16px}
  .panel h3{margin:0 0 10px;font-family:Georgia,serif;font-variant:small-caps;
    letter-spacing:.08em;font-weight:600;color:var(--brass2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .form .wide{grid-column:1/-1}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
  .bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    align-items:center;gap:4px;font:11px var(--mono);color:var(--dim);min-width:26px}
  .bars .bar i{display:block;width:100%;background:linear-gradient(180deg,var(--brass2),var(--brass));
    border-radius:2px 2px 0 0;min-height:2px}
  .bars .bar b{color:var(--paper);font-weight:400}
  .logline{font-family:var(--mono);font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .logline .turn{color:var(--brass2)}

  /* ── симулятор боёв: 2D-проигрыватель ── */
  .winbar{display:flex;height:22px;border:1px solid var(--line);border-radius:4px;overflow:hidden;
    font:11px var(--mono);margin:4px 0 10px}
  .winbar i{display:flex;align-items:center;justify-content:center;color:#10141c;white-space:nowrap}
  .winbar .wb-l{background:linear-gradient(180deg,var(--brass2),var(--brass))}
  .winbar .wb-d{background:var(--line);color:var(--dim)}
  .winbar .wb-r{background:linear-gradient(180deg,#7db0e8,#3f7fc4)}
  .sim-stage{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:12px;align-items:start}
  .sim-col{display:flex;flex-direction:column;gap:5px;max-height:430px;overflow:auto}
  .sim-col h4{margin:0 0 2px;font:600 12px var(--mono);color:var(--dim);letter-spacing:.06em}
  .sim-fighter{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;
    padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--ink2);
    transition:background .15s,border-color .15s}
  .sim-fighter.right{direction:rtl}
  .sim-fighter.right .sim-fname,.sim-fighter.right .sim-hp{direction:ltr}
  .sim-fname{font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sim-fbar{grid-column:1/-1;height:9px;background:#10141c;border-radius:5px;overflow:hidden}
  .sim-fbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5fa85a,#8fd089);
    transition:width .18s linear}
  .sim-fbar i.low{background:linear-gradient(90deg,#c0533f,#e07a6a)}
  .sim-hp{font:11px var(--mono);color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
  .sim-fighter.hit{border-color:var(--debit);background:rgba(224,122,106,.16)}
  .sim-fighter.crit{border-color:var(--brass);background:rgba(231,189,110,.2)}
  .sim-fighter.dodge{border-color:#3f7fc4;background:rgba(63,127,196,.14)}
  .sim-fighter.dead{opacity:.4;filter:grayscale(.7)}
  .sim-fighter.dead .sim-fname{text-decoration:line-through}
  .sim-totals{display:flex;flex-direction:column;gap:10px}
  .sim-total .sim-fbar{height:16px}
  .sim-feed{border:1px solid var(--line);border-radius:4px;background:var(--ink2);
    padding:6px 8px;max-height:430px;overflow:auto;font:12px var(--mono)}
  .sim-feed .fl{padding:2px 0;border-bottom:1px dashed var(--line)}
  .sim-feed .fl.crit{color:var(--brass2)} .sim-feed .fl.block{color:#8fb6e6}
  .sim-feed .fl.dodge{color:var(--dim)} .sim-feed .fl.kill{color:var(--debit)}
  .sim-feed .fl .tn{color:var(--brass)}
  #sp-speed{vertical-align:middle}
  @media (max-width:640px){.sim-stage{grid-template-columns:1fr}}

  /* ===== Живой бой (интерактивный движок боя прямо в админке) ===== */
  .ls-setup{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:12px}
  .ls-setup .fld{display:flex;flex-direction:column;gap:3px}
  .ls-setup label{margin:0}
  .ls-setup input,.ls-setup select{width:96px}
  .ls-banner{margin:8px 0;padding:8px 12px;border:1px solid var(--brass);border-radius:4px;
    background:rgba(201,149,63,.08);font:13px var(--mono);color:var(--brass2)}
  .ls-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (max-width:1100px){.ls-grid{grid-template-columns:1fr}}
  .ls-panel{border:1px solid var(--line);border-radius:6px;background:var(--ink2);
    padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .ls-panel.left{border-top:3px solid #5a8fd0}
  .ls-panel.right{border-top:3px solid #d07a6a}
  .ls-panel.active{box-shadow:0 0 0 2px var(--brass2);border-color:var(--brass2)}
  .ls-panel.dead{opacity:.5;filter:grayscale(.6)}
  .ls-head{display:flex;align-items:center;gap:8px}
  .ls-name{font:600 14px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .ls-tag{font:10px var(--mono);letter-spacing:.08em;color:var(--dim);
    border:1px solid var(--line);border-radius:3px;padding:1px 5px}
  .ls-auto{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
  .ls-auto input{width:auto}
  .ls-bars{display:flex;flex-direction:column;gap:4px}
  .ls-bar{height:14px;background:#10141c;border-radius:4px;overflow:hidden;position:relative}
  .ls-bar i{display:block;height:100%;transition:width .25s}
  .ls-bar.hp i{background:linear-gradient(90deg,#5fa85a,#8fd089)}
  .ls-bar.hp i.low{background:linear-gradient(90deg,#c0533f,#e07a6a)}
  .ls-bar.mp i{background:linear-gradient(90deg,#3f6fb0,#6f9fd9)}
  .ls-bar span{position:absolute;inset:0;text-align:center;font:10px/14px var(--mono);
    color:#fff;text-shadow:0 1px 2px #000}
  .ls-fx{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
  .ls-chip{font:11px var(--mono);padding:1px 6px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel)}
  .ls-chip.buff{border-color:#5fa85a;color:#9fe0a0}
  .ls-chip.debuff{border-color:#d07a6a;color:#f0a99a}
  .ls-zones{display:flex;gap:10px;flex-wrap:wrap}
  .ls-zrow{display:flex;flex-direction:column;gap:3px}
  .ls-zrow b{font:10px var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
  .ls-zbtns{display:flex;gap:4px}
  .ls-zbtns button{padding:4px 9px;font-size:12px}
  .ls-zbtns button.on{background:var(--brass);border-color:var(--brass);color:#1a1407;font-weight:600}
  .ls-act{display:flex;gap:6px;flex-wrap:wrap}
  .ls-act .strike{background:#7a3a30;border-color:#a04a3a;color:#ffd9d0}
  .ls-belt{display:flex;flex-wrap:wrap;gap:4px}
  .ls-belt button{padding:3px 7px;font-size:11px;position:relative}
  .ls-belt button:disabled{opacity:.4;cursor:default}
  .ls-belt button .q{font-size:9px;color:var(--dim);margin-left:3px}
  .ls-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
    border-top:1px dashed var(--line);padding-top:6px}
  .ls-stats .s{display:flex;flex-direction:column;gap:1px}
  .ls-stats label{margin:0;font-size:10px}
  .ls-stats input{width:100%;padding:3px 5px;font-size:12px}
  .ls-feed{margin-top:12px;border:1px solid var(--line);border-radius:4px;background:var(--ink2);
    font-family:var(--mono);font-size:12px;padding:8px 10px;max-height:200px;overflow:auto}
  .ls-feed .fl{padding:2px 0;border-bottom:1px dashed var(--line)}
  .ls-feed .fl.crit{color:var(--brass2)} .ls-feed .fl.kill{color:var(--debit)}
  .ls-feed .fl.fx{color:#9fbf9f} .ls-feed .fl.sys{color:var(--dim)}
  .ls-timer{font:600 22px var(--mono);color:var(--brass2);text-align:center;
    font-variant-numeric:tabular-nums}
  @media (max-width:900px){#app{grid-template-columns:64px 1fr}
    .wordmark{font-size:13px;padding:12px 8px}.wordmark small{display:none}
    nav button{padding:8px 10px;font-size:12px}
    .grid2{grid-template-columns:1fr}}

  /* Телефон: боковое меню превращается в верхнюю ленту, всё в одну колонку */
  @media (max-width:640px){
    #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
    aside{grid-row:auto;grid-column:1;flex-direction:row;align-items:stretch;
      border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
    aside .wordmark{display:none}
    nav{display:flex;flex-direction:row;padding:0;overflow-x:auto;width:100%}
    nav button{border-left:none;border-bottom:3px solid transparent;border-radius:0;
      white-space:nowrap;padding:11px 13px;font-size:13px}
    nav button.active{border-left:none;border-bottom-color:var(--brass);background:rgba(201,149,63,.07)}
    header{padding:0 12px;gap:8px}
    header h1{font-size:14px}
    .stamp-env{display:none}
    main{padding:12px 12px 64px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .grid2,.form{grid-template-columns:1fr}
    .cards{gap:8px}.card{min-width:0;flex:1 1 44%;padding:10px 12px}
    .card b{font-size:18px}
    .toolbar{gap:8px}.toolbar input,.toolbar select{flex:1 1 130px;min-width:0}
    table{font-size:11.5px}th,td{padding:5px 7px}
    #toast{left:12px;right:12px;bottom:12px;max-width:none}
  }

  #toast{position:fixed;right:22px;bottom:22px;background:var(--ink2);
    border:2px solid var(--brass);color:var(--brass2);
    font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;
    padding:10px 16px;border-radius:2px;transform:rotate(-1.2deg);
    opacity:0;transition:opacity .18s;pointer-events:none;max-width:360px}
  #toast.show{opacity:1}
  #toast.err{border-color:var(--debit);color:var(--debit)}
  @media (prefers-reduced-motion: reduce){#toast{transform:none;transition:none}}

  /* ── модалки: формы с выбором из списков вместо prompt()/confirm() ── */
  .modal-back{position:fixed;inset:0;background:rgba(8,10,16,.66);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:18px}
  .modal-card{background:var(--panel);border:1px solid var(--brass);border-radius:6px;
    width:430px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .modal-card.wide{width:780px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;border-bottom:1px solid var(--line);
    font-family:Georgia,serif;font-variant:small-caps;letter-spacing:.06em;color:var(--brass2)}
  .modal-x{background:none;border:none;color:var(--dim);font-size:16px;padding:2px 7px}
  .modal-x:hover{color:var(--paper)}
  .modal-body{padding:16px;overflow:auto}
  .m-form{display:flex;flex-direction:column;gap:13px}
  .m-field label{margin-bottom:4px}
  .m-field input,.m-field select,.m-field textarea{width:100%}
  .m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:2px}
  /* пикер «выбрать из списка» */
  .picker{position:relative}
  .picker-chip{margin-top:6px;font:12px var(--mono);color:var(--brass2)}
  .picker-chip:empty{display:none}
  .picker-drop{position:absolute;left:0;right:0;top:100%;margin-top:3px;z-index:5;
    background:var(--ink2);border:1px solid var(--brass);border-radius:4px;max-height:240px;
    overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .picker-drop.hide{display:none}
  .picker-opt{padding:7px 11px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
  .picker-opt:hover{background:rgba(201,149,63,.12)}
  .picker-opt small{color:var(--dim)}
  /* характеристики предмета — строки ключ/значение */
  .stat-row{display:grid;grid-template-columns:1fr 120px 32px;gap:8px;margin-bottom:7px;align-items:center}
  .stat-row .sx-del{padding:3px 0}
  /* 3D-превью модели */
  .model-preview{margin-top:10px;height:280px;border:1px solid var(--line);border-radius:4px;
    background:radial-gradient(circle at 50% 32%,#262f43,#11151e);position:relative;overflow:hidden}
  .model-preview canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  .model-preview canvas:active{cursor:grabbing}
  .mp-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font:12px var(--mono);text-align:center;padding:12px}
  .mp-hint.err{color:var(--debit)}
  .hdr-give{margin-left:6px}
  @media (max-width:640px){.modal-card,.modal-card.wide{width:100%}
    .stat-row{grid-template-columns:1fr 88px 30px}}

  #login{height:100%;display:flex;align-items:center;justify-content:center}
  #login form{background:var(--ink2);border:1px solid var(--line);border-radius:4px;
    padding:28px 30px;width:300px;text-align:center}
  #login .wordmark{border:none;padding:0 0 14px}
</style>
</head>
<body>

<div id="login" style="display:none">
  <form id="login-form">
    <div class="wordmark">Гроссбух мира<small>панель управления · local</small></div>
    <input id="login-pass" type="password" placeholder="Пароль администратора"
           style="width:100%;margin-bottom:10px" autofocus>
    <button class="brass" style="width:100%">Открыть книгу</button>
    <div id="login-err" class="debit" style="margin-top:8px;font-size:12px"></div>
  </form>
</div>

<div id="app">
  <aside>
    <div class="wordmark">Гроссбух мира<small>mmo_game · mmo_auth · redis</small></div>
    <nav id="nav"></nav>
  </aside>
  <header><h1 id="hdr-title"></h1>
    <button class="brass sm hdr-give" type="button" onclick="grant()">+ Выдать</button>
    <span class="stamp-env">LOCAL</span><span id="hdr-online"></span></header>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt = (v) => v ? new Date(v).toLocaleString('ru-RU',
  {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

let KEY = sessionStorage.getItem('adminKey') || '';

async function api(path, body){
  const r = await fetch('/admin/api' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: {'Content-Type':'application/json','x-admin-key':KEY},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401){ logout(); throw new Error('нужен вход'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}
async function upload(file){
  const r = await fetch('/admin/api/upload?name=' + encodeURIComponent(file.name),
    { method:'POST', headers:{'x-admin-key':KEY}, body:file });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d.url;
}

let toastT = null;
function stamp(text, err = false){
  const t = $('#toast');
  t.textContent = text; t.className = err ? 'err show' : 'show';
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
const ok = (t) => stamp('Проведено · ' + t);
const fail = (e) => stamp('Отказано · ' + e.message, true);

/* ===================================================================== *
 *  Модалки и пикеры: вместо prompt()/confirm() — формы с выбором из
 *  списков (игрок, предмет), выпадашками валют/локаций и т.п.
 * ===================================================================== */
function modalKey(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  const m = $('#modal'); if (!m) return;
  m.remove(); document.removeEventListener('keydown', modalKey);
}
function openModal(title, bodyHTML, { wide = false } = {}){
  closeModal();
  const back = document.createElement('div');
  back.id = 'modal'; back.className = 'modal-back';
  back.innerHTML = `<div class="modal-card${wide ? ' wide' : ''}">
    <div class="modal-head"><span>${esc(title)}</span>
      <button class="modal-x" type="button" aria-label="Закрыть">✕</button></div>
    <div class="modal-body">${bodyHTML}</div></div>`;
  back.addEventListener('mousedown', (e) => { if (e.target === back) closeModal(); });
  back.querySelector('.modal-x').onclick = closeModal;
  document.body.appendChild(back);
  document.addEventListener('keydown', modalKey);
  return back.querySelector('.modal-card');
}

let _locs = null;

/* HTML одного поля формы по описанию { key, label, type, value, ... } */
function fieldHTML(f){
  const id = 'mf-' + f.key, v = f.value ?? '';
  let ctrl;
  switch (f.type){
    case 'number':
      ctrl = `<input id="${id}" type="number" ${f.step ? `step="${f.step}"` : ''} value="${esc(v)}">`; break;
    case 'textarea':
      ctrl = `<textarea id="${id}" rows="${f.rows || 3}">${esc(v)}</textarea>`; break;
    case 'checkbox':
      ctrl = `<select id="${id}"><option value="1" ${v ? 'selected' : ''}>да</option>
        <option value="0" ${!v ? 'selected' : ''}>нет</option></select>`; break;
    case 'select':
      ctrl = `<select id="${id}">${opt(f.options, v, f.empty)}</select>`; break;
    case 'currency':
      ctrl = `<select id="${id}">${opt(D.currency, v || 'copper')}</select>`; break;
    case 'location':
      ctrl = `<select id="${id}"><option>загрузка…</option></select>`; break;
    case 'player': case 'item':
      ctrl = `<div class="picker" data-kind="${f.type}">
        <input id="${id}-q" autocomplete="off" placeholder="${
          f.type === 'player' ? 'имя или ID игрока…' : 'название или ID предмета…'}">
        <input id="${id}" type="hidden" value="${esc(v)}">
        <div class="picker-drop hide" id="${id}-drop"></div>
        <div class="picker-chip" id="${id}-chip"></div></div>`; break;
    default:
      ctrl = `<input id="${id}" value="${esc(v)}">`;
  }
  return `<div class="m-field" data-key="${esc(f.key)}">
    <label for="${id}">${esc(f.label || f.key)}</label>${ctrl}
    ${f.help ? `<div class="muted" style="font-size:11px;margin-top:4px">${esc(f.help)}</div>` : ''}</div>`;
}

async function wireField(card, f){
  if (f.type === 'location'){
    const sel = card.querySelector('#mf-' + f.key);
    try {
      const locs = await locationsCached();
      sel.innerHTML = locs.map((l) =>
        `<option value="${l.id}" ${String(f.value) === String(l.id) ? 'selected' : ''}>${
          esc(l.name)} #${l.id}</option>`).join('');
    } catch { sel.innerHTML = '<option value="">— ошибка загрузки —</option>'; }
  }
  if (f.type === 'player' || f.type === 'item') setupPicker(card, f);
}

/* живой поиск + выбор из выпадающего списка (игрок / предмет) */
function setupPicker(card, f){
  const q = card.querySelector('#mf-' + f.key + '-q');
  const hidden = card.querySelector('#mf-' + f.key);
  const drop = card.querySelector('#mf-' + f.key + '-drop');
  const chip = card.querySelector('#mf-' + f.key + '-chip');
  let timer = null;
  const fmt = (r) => f.type === 'player'
    ? `${esc(r.name)} <small>#${r.id} · ур.${r.level} · ${esc(r.location || '')}</small>`
    : `${esc(r.name)} <small>#${r.id} · ${dict(D.itemType, r.type)}</small>`;
  const chosen = (id, name) => {
    chip.innerHTML = `выбрано: <b>${esc(name)}</b> #${id} ` +
      `<button type="button" class="sm px-clear">сменить</button>`;
    chip.querySelector('.px-clear').onclick = () => { hidden.value = ''; chip.textContent = ''; q.focus(); };
  };
  const pick = (r) => { hidden.value = r.id; q.value = ''; drop.classList.add('hide'); drop.innerHTML = '';
    chosen(r.id, r.name); };
  const search = async () => {
    const term = q.value.trim();
    if (!term){ drop.classList.add('hide'); drop.innerHTML = ''; return; }
    try {
      const rows = await api((f.type === 'player' ? '/characters?q=' : '/item-templates?q=')
        + encodeURIComponent(term));
      const top = rows.slice(0, 12);
      drop.innerHTML = top.length
        ? top.map((r, i) => `<div class="picker-opt" data-i="${i}">${fmt(r)}</div>`).join('')
        : '<div class="picker-opt muted">ничего не найдено</div>';
      drop.classList.remove('hide');
      top.forEach((r, i) => {
        const el = drop.querySelector(`[data-i="${i}"]`); if (el) el.onclick = () => pick(r);
      });
    } catch (e) {
      drop.innerHTML = `<div class="picker-opt debit">ошибка: ${esc(e.message)}</div>`;
      drop.classList.remove('hide');
    }
  };
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 220); });
  q.addEventListener('focus', () => { if (q.value.trim()) search(); });
  // клик вне списка прячет выпадашку; слушатель на карточке — уйдёт с модалкой
  card.addEventListener('mousedown', (e) => {
    if (!drop.contains(e.target) && e.target !== q) drop.classList.add('hide');
  });
  if (f.value) chosen(f.value, '#' + f.value);   // предвыбор при редактировании
}

function readField(card, f){
  const el = card.querySelector('#mf-' + f.key);
  if (!el) return null;
  if (f.type === 'number') return el.value === '' ? null : +el.value;
  if (f.type === 'checkbox') return el.value === '1';
  if (f.type === 'player' || f.type === 'item') return el.value === '' ? null : +el.value;
  return el.value;
}

/* Готовая форма-модалка: возвращает {значения} или null (отмена/закрытие). */
function formModal({ title, fields, submit = 'Провести', wide = false }){
  return new Promise((resolve) => {
    const card = openModal(title, `<form id="m-form" class="m-form">
      ${fields.map(fieldHTML).join('')}
      <div class="m-actions">
        <button type="button" class="m-cancel">Отмена</button>
        <button type="submit" class="brass">${esc(submit)}</button></div></form>`, { wide });
    let done = false;
    fields.forEach((f) => wireField(card, f));
    card.querySelector('.m-cancel').onclick = () => { done = true; closeModal(); resolve(null); };
    card.querySelector('#m-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const out = {};
      for (const f of fields){
        const v = readField(card, f);
        if (f.required && (v === '' || v == null))
          return stamp('Заполните: ' + (f.label || f.key), true);
        out[f.key] = v;
      }
      done = true; closeModal(); resolve(out);
    });
    const obs = new MutationObserver(() => {     // закрыли крестиком/фоном/Esc → null
      if (!document.body.contains(card) && !done){ done = true; obs.disconnect(); resolve(null); }
    });
    obs.observe(document.body, { childList: true });
  });
}

/* ── Ленивая загрузка three.js (из CDN) для 3D-превью моделей ── */
let _three = null;
async function loadThree(){
  if (_three) return _three;
  const base = 'https://esm.sh/three@0.160.0';
  const THREE = await import(base);
  const [{ GLTFLoader }, { FBXLoader }] = await Promise.all([
    import(base + '/examples/jsm/loaders/GLTFLoader.js'),
    import(base + '/examples/jsm/loaders/FBXLoader.js'),
  ]);
  _three = { THREE, GLTFLoader, FBXLoader };
  return _three;
}
let _preview = null;
function disposePreview(){ if (_preview){ try { _preview.dispose(); } catch {} _preview = null; } }
const modelExt = (s) => String(s || '').split('?')[0].split('.').pop().toLowerCase();

async function mountModelPreview(host, src, ext){
  disposePreview();
  if (!host) return;
  host.innerHTML = '<div class="mp-hint">Загрузка 3D-движка…</div>';
  let M;
  try { M = await loadThree(); }
  catch { host.innerHTML = '<div class="mp-hint err">3D-превью недоступно: нет доступа к CDN three.js</div>'; return; }
  const { THREE, GLTFLoader, FBXLoader } = M;
  host.innerHTML = '<div class="mp-hint">Загрузка модели…</div>';
  let obj;
  try {
    if (ext === 'fbx') obj = await new FBXLoader().loadAsync(src);
    else { const g = await new GLTFLoader().loadAsync(src); obj = g.scene; }
  } catch (e) {
    host.innerHTML = `<div class="mp-hint err">Не удалось загрузить модель: ${esc(e.message || 'ошибка')}</div>`;
    return;
  }
  host.innerHTML = '';
  const w = host.clientWidth || 420, h = host.clientHeight || 280;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, w / h, 0.01, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x33373f, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(2, 4, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(-3, 2, -4); scene.add(rim);
  const pivot = new THREE.Group(); scene.add(pivot);
  // нормализация: центр в 0, наибольший габарит → 2 единицы
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxD = Math.max(size.x, size.y, size.z) || 1;
  obj.position.sub(center); obj.scale.setScalar(2 / maxD); pivot.add(obj);
  camera.position.set(0, 0.3, 4); camera.lookAt(0, 0, 0);
  let drag = false, lx = 0, ly = 0, auto = true;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (e) => { drag = true; auto = false; lx = e.clientX; ly = e.clientY;
    el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (!drag) return;
    pivot.rotation.y += (e.clientX - lx) * 0.01; pivot.rotation.x += (e.clientY - ly) * 0.01;
    lx = e.clientX; ly = e.clientY; });
  const stop = () => { drag = false; };
  el.addEventListener('pointerup', stop); el.addEventListener('pointercancel', stop);
  let raf = 0; const clock = new THREE.Clock();
  const tick = () => { raf = requestAnimationFrame(tick);
    const dt = clock.getDelta(); if (auto) pivot.rotation.y += dt * 0.6;
    renderer.render(scene, camera); };
  tick();
  _preview = { dispose(){ cancelAnimationFrame(raf); renderer.dispose(); renderer.domElement.remove(); } };
}

function table(cols, rows, rowAttr){
  if (!rows.length) return '<p class="muted">Записей нет — книга на этой странице пуста.</p>';
  return `<table><thead><tr>${cols.map((c)=>`<th>${c.h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r)=>`<tr ${rowAttr ? rowAttr(r) : ''}>${
    cols.map((c)=>c.html ? c.html(r) : `<td>${esc(c.v(r))}</td>`).join('')
  }</tr>`).join('')}</tbody></table>`;
}
function barChart(rows, labelKey, valueKey){
  if (!rows.length) return '<p class="muted">Данных пока нет.</p>';
  const max = Math.max(...rows.map((r) => +r[valueKey]), 1);
  return `<div class="bars">${rows.map((r)=>`
    <div class="bar"><b>${r[valueKey]}</b>
      <i style="height:${Math.round(100 * r[valueKey] / max)}%"></i>
      <span>${esc(r[labelKey])}</span></div>`).join('')}</div>`;
}

/* Флагман: «Выдать игроку» — выбор игрока из списка + предмет ИЛИ валюта,
   с переключателем. Доступно из шапки и со страницы персонажа (preset). */
window.grant = async (presetCharId) => {
  const F = {
    player: { key:'character_id', label:'Игрок', type:'player', value: presetCharId || '' },
    kind:   { key:'kind', label:'Что выдать', type:'select', options:{ item:'Предмет', currency:'Валюта' }, value:'item' },
    item:   { key:'template_id', label:'Предмет', type:'item' },
    qty:    { key:'quantity', label:'Количество', type:'number', value:1 },
    code:   { key:'code', label:'Валюта', type:'currency', value:'copper' },
    amount: { key:'amount', label:'Сумма', type:'number', value:100 },
    note:   { key:'note', label:'Основание (в аудит)', type:'text' },
  };
  const card = openModal('Выдать игроку', `<form id="m-form" class="m-form">
    ${fieldHTML(F.player)}${fieldHTML(F.kind)}
    <div data-grp="item">${fieldHTML(F.item)}${fieldHTML(F.qty)}</div>
    <div data-grp="currency" style="display:none">${fieldHTML(F.code)}${fieldHTML(F.amount)}</div>
    ${fieldHTML(F.note)}
    <div class="m-actions"><button type="button" class="m-cancel">Отмена</button>
      <button type="submit" class="brass">Выдать</button></div></form>`);
  Object.values(F).forEach((f) => wireField(card, f));
  const sync = () => { const k = card.querySelector('#mf-kind').value;
    card.querySelector('[data-grp="item"]').style.display = k === 'item' ? '' : 'none';
    card.querySelector('[data-grp="currency"]').style.display = k === 'currency' ? '' : 'none'; };
  card.querySelector('#mf-kind').addEventListener('change', sync); sync();
  card.querySelector('.m-cancel').onclick = closeModal;
  card.querySelector('#m-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const charId = readField(card, F.player);
    if (!charId) return stamp('Выберите игрока', true);
    try {
      if (readField(card, F.kind) === 'item'){
        const tpl = readField(card, F.item); if (!tpl) return stamp('Выберите предмет', true);
        const r = await api(`/characters/${charId}/give-item`,
          { template_id: tpl, quantity: readField(card, F.qty) || 1 });
        ok('выдан предмет #' + r.itemId);
      } else {
        const amount = readField(card, F.amount); if (!amount) return stamp('Укажите сумму', true);
        const r = await api(`/characters/${charId}/currency`,
          { code: readField(card, F.code), amount, note: readField(card, F.note) || null });
        ok('баланс ' + r.balance);
      }
      closeModal();
      if (current === 'chars' && document.querySelector('h2')) openChar(charId);
    } catch (err) { fail(err); }
  });
};

window.openBattle = async (id) => {
  const d = await api('/battles/' + id);
  const names = Object.fromEntries(d.participants.map((p) => [p.character_id, p.name]));
  const npc = (d.battle.meta || {}).npcName || 'Противник';
  const nm = (cid) => cid ? (names[cid] || '#' + cid) : npc;
  const line = (r) => {
    const a = nm(r.actor_id), t = nm(r.target_id);
    const z = dict(D.zone, (r.effects || {}).zone);
    switch (r.action_type) {
      case 1: return `<b>${esc(a)}</b> бьёт <b>${esc(t)}</b> в ${z} — <b>${r.value}</b>`;
      case 2: return `<b>${esc(t)}</b> блокирует удар <b>${esc(a)}</b> в ${z} — лишь <b>${r.value}</b>`;
      case 3: return `<b>${esc(t)}</b> уворачивается от удара <b>${esc(a)}</b>`;
      case 4: return `<b>${esc(a)}</b> бьёт <b>${esc(t)}</b> в ${z} — <span class="debit">КРИТ ${r.value}</span>`;
      case 5: return `<span class="debit"><b>${esc(t)}</b> погибает</span>`;
      case 6: return `<b>${esc(a)}</b> применяет способность на <b>${esc(t)}</b>`;
      default: return `действие ${r.action_type}`;
    }
  };
  let log = '', lastTurn = 0;
  for (const r of d.rounds) {
    if (r.round_no !== lastTurn) {
      lastTurn = r.round_no;
      log += `<div class="logline"><span class="turn">— Ход ${r.round_no} —</span></div>`;
    }
    log += `<div class="logline">${line(r)}</div>`;
  }
  $('#main').innerHTML = `
  <div class="toolbar"><button onclick="show('battles')">← К списку</button>
    <h2 style="margin:0;font-family:Georgia,serif;font-variant:small-caps">Бой #${id}
      <span class="muted">· ${dict(D.bType,d.battle.type)} · ${dict(D.bStatus,d.battle.status)}</span></h2>
    ${d.battle.status === 2 || d.battle.status === 1
      ? `<button class="brass" onclick="toggleIntervention(${id}, ${d.battle.intervention !== 1})">
           ${d.battle.intervention === 1 ? 'Закрыть вмешательство' : 'Открыть вмешательство'}</button>
         <button class="danger" onclick="abortBattle(${id})">Прервать бой</button>` : ''}</div>
  <div class="panel"><h3>Участники</h3>
    ${table([{h:'Сторона',v:r=>r.side},{h:'Имя',v:r=>r.name},
      {h:'Итог',v:r=>dict(D.result,r.result)},{h:'Урон',v:r=>r.damage_dealt},
      {h:'Опыт',v:r=>r.exp_gained}], d.participants)}</div>
  <div class="panel"><h3>Журнал боя</h3>${log || '<p class="muted">Ходов ещё не было.</p>'}</div>`;
};

  if (!confirm('Прервать бой #' + id + '? Награды не начислятся.')) return;
  // тело {} обязательно: api() без тела шлёт GET, а маршрут принимает POST
  try { await api(`/battles/${id}/abort`, {}); ok('бой #' + id + ' прерван'); openBattle(id); }
  catch (e) {
    fail(e.message === 'battle_not_active'

  return `

    проверить <b>баланс статов и формул</b>. Характеристики — как на экране параметров (без «Водой»),
    дефолтные и растут с уровнем; вещи/прокачка в симуляторе задаются прямо значениями. Эликсиры мощи

  <div class="grid2">${team('left','Команда A (слева)','Альфа')}${team('right','Команда B (справа)','Бета')}</div>
  <div class="panel"><h3>Прогон</h3>
    <div class="form">
      <div><label>Боёв</label><input id="sim-battles" type="number" value="200"></div>
      <div><label>Лимит ходов (раундов)</label><input id="sim-maxturns" type="number" value="200"></div>

      <input id="sim-animate" type="checkbox" style="width:auto" ${pc ? '' : 'disabled'}>
      Показывать 2D-анимацию (до 4 боёв${pc ? '' : ', только ПК'})</label>

    <div class="toolbar" style="margin-top:12px">
      <button class="brass" id="sim-run" onclick="runSim()">Запустить</button>
      <span class="muted">БД и живые бои не затрагиваются.</span></div></div>
  <details class="panel"><summary style="cursor:pointer;color:var(--brass2);font-family:Georgia,serif;
    font-variant:small-caps;letter-spacing:.06em">Коэффициенты формул (тонкая настройка баланса)</summary>
    <div class="form" style="margin-top:10px">${SIM_COEF.map((c) =>
      `<div><label>${c[1]}</label><input data-coef="${c[0]}" type="number"${
        c[3] ? ` step="${c[3]}"` : ''} value="${c[2]}"></div>`).join('')}</div>

      видно сдвиг винрейта и статистики.</p></details>

function simProfile(side){
  const g = (grp, k) => document.querySelector(`[data-side="${side}"][data-grp="${grp}"][data-k="${k}"]`);
  const v = (grp, k) => { const el = g(grp, k); return el ? +el.value : undefined; };
  const stats = {}; SIM_STATS.forEach(([k]) => stats[k] = v('stat', k));
  const elixir = {}; SIM_ELIX.forEach(([k]) => elixir[k] = v('elix', k));
  const nameEl = g('meta', 'name');
  return { name: nameEl ? nameEl.value : '', count: v('meta', 'count'),
    level: v('meta', 'level'), varPct: v('meta', 'varPct'), stats, elixir };
}

window.runSim = async () => {
  const animate = !!($('#sim-animate') && $('#sim-animate').checked);
  let battles = +$('#sim-battles').value || 1;
  if (animate && battles > 4){ battles = 4; $('#sim-battles').value = 4; stamp('Анимация: не больше 4 боёв'); }
  const left = simProfile('left'), right = simProfile('right');
  if (!left.count || !right.count) return stamp('Укажите число бойцов в обеих командах', true);
  const coef = {};
  document.querySelectorAll('[data-coef]').forEach((el) => { if (el.value !== '') coef[el.dataset.coef] = +el.value; });
  const body = { battles, maxTurns: +$('#sim-maxturns').value || 200,
    switchChance: +$('#sim-switch').value, animate, left, right, coef };
  const btn = $('#sim-run'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'Считаем…';
  $('#sim-out').innerHTML = '<p class="muted">Симулируем…</p>';
  if (SP){ SP.destroy(); SP = null; }
  try {
    const d = await api('/simulate', body);
    SIM_LAST = d;
    $('#sim-out').innerHTML = renderSimResults(d);
    if (d.timelines && d.timelines.length) initSimPlayer(d.timelines);
    ok(`${d.params.battles} боёв · ${d.perf.wallMs} мс`);
  } catch (e){ $('#sim-out').innerHTML = ''; fail(e); }
  finally { btn.disabled = false; btn.textContent = old; }
};

function renderSimResults(d){
  const p = d.perf, b = d.balance, c = d.combat;

  const card = (v, t) => `<div class="card" style="cursor:default;min-width:118px"><b>${v}</b><span>${t}</span></div>`;
  const total = Math.max(1, b.winsLeft + b.winsRight + b.draws);
  const w = (x) => Math.round(x / total * 100);
  const winbar = `<div class="winbar">
    <i class="wb-l" style="width:${w(b.winsLeft)}%">${b.winsLeft ? 'A ' + b.winRateLeft + '%' : ''}</i>
    <i class="wb-d" style="width:${w(b.draws)}%">${b.draws ? 'ничьи ' + w(b.draws) + '%' : ''}</i>
    <i class="wb-r" style="width:${w(b.winsRight)}%">${b.winsRight ? 'B ' + b.winRateRight + '%' : ''}</i></div>`;
  const cl = c ? c.left : null, cr = c ? c.right : null;
  const combatPanel = c ? `<div class="panel"><h3>Боевая статистика</h3>
    ${table([{h:'Показатель',v:r=>r[0]},{h:'Команда A',v:r=>r[1]},{h:'Команда B',v:r=>r[2]}],[
      ['Ударов', nf(cl.attacks), nf(cr.attacks)],
      ['Криты (доля попаданий)', `${nf(cl.crits)} (${cl.critRate}%)`, `${nf(cr.crits)} (${cr.critRate}%)`],
      ['Увороты против (доля атак)', `${nf(cl.dodgedAgainst)} (${cl.dodgeRate}%)`, `${nf(cr.dodgedAgainst)} (${cr.dodgeRate}%)`],
      ['Блоки (доля попаданий)', `${nf(cl.blocked)} (${cl.blockRate}%)`, `${nf(cr.blocked)} (${cr.blockRate}%)`],
      ['Контратаки (доля атак)', `${nf(cl.counters)} (${cl.counterRate}%)`, `${nf(cr.counters)} (${cr.counterRate}%)`],
      ['Ср. урон / попадание', nf(cl.avgDamagePerHit), nf(cr.avgDamagePerHit)],
      ['Убийств / бой', cl.avgKillsPerBattle, cr.avgKillsPerBattle],
      ['Эликсир мощи (раз)', nf(cl.elixPower), nf(cr.elixPower)],
      ['Эликсир HP (раз / суммарно)', `${nf(cl.elixHeal)} / ${nf(cl.elixHealAmt)}`, `${nf(cr.elixHeal)} / ${nf(cr.elixHealAmt)}`],
    ])}</div>` : '';
  return `
  ${d.partial ? '<div class="panel"><span class="debit">Прервано по лимиту времени (25 с) — результат частичный.</span></div>' : ''}
  <div class="panel"><h3>Нагрузка</h3><div class="cards">
    ${card(p.wallMs + ' мс','Время (wall)')}${card(p.cpuMs + ' мс','CPU')}
    ${card(p.perBattleMs + ' мс','На бой')}${card(nf(p.battlesPerSec),'Боёв/с')}
    ${card(nf(p.strikesPerSec),'Ударов/с')}${card(nf(b.totalStrikes),'Ударов всего')}
    ${card(p.heapUsedDeltaMb + ' МБ','Heap Δ')}${card(p.rssMb + ' МБ','RSS')}
  </div></div>
  <div class="panel"><h3>Баланс · ${d.params.battles} боёв</h3>
    ${winbar}
    ${table([{h:'Метрика',v:r=>r[0]},{h:'Команда A',v:r=>r[1]},{h:'Команда B',v:r=>r[2]}],[
      ['Победы',`${b.winsLeft} (${b.winRateLeft}%)`,`${b.winsRight} (${b.winRateRight}%)`],
      ['Средний урон / бой',nf(b.avgDmgLeft),nf(b.avgDmgRight)],
    ])}
    <div class="muted" style="margin-top:8px">Ничьи/таймауты: ${b.draws} · средняя длина: ${b.avgTurns} ходов
      (${b.avgSubTurns} ударов/бой) · по таймауту: ${b.timedOut}</div>
  </div>
  ${combatPanel}`;

/* ── 2D-проигрыватель записанных боёв (rows-режим, до 40 бойцов/сторону) ── */
const SIM_ZONE = { high:'голову', mid:'корпус', low:'ноги' };
function initSimPlayer(timelines){
  if (SP){ SP.destroy(); SP = null; }
  const host = document.createElement('div');
  host.className = 'panel';
  const opts = timelines.map((tl, i) =>
    `<option value="${i}">Бой ${tl.battle} · ${tl.winner ? 'победа ' + (tl.winner === 'left' ? 'A' : 'B') : 'ничья'} · ${tl.events.length} ударов</option>`).join('');
  host.innerHTML = `<h3>2D-анимация боя</h3>
    <div class="toolbar">
      <select id="sp-battle">${opts}</select>
      <button id="sp-play" class="brass">▶ Старт</button>
      <button id="sp-restart">⟲ Заново</button>
      <label style="display:flex;gap:6px;align-items:center">Скорость
        <input id="sp-speed" type="range" min="60" max="900" step="20" value="380"></label>
      <span id="sp-progress" class="muted"></span></div>
    <div class="sim-stage">
      <div class="sim-col" id="sp-left"></div>
      <div class="sim-feed" id="sp-feed"></div>
      <div class="sim-col" id="sp-right"></div></div>`;
  $('#sim-out').appendChild(host);

  const S = { timelines, idx:0, ev:0, lastTurn:0, timer:null, speed:380, playing:false, fmap:{}, tl:null };
  const feed = host.querySelector('#sp-feed');
  const progEl = host.querySelector('#sp-progress');
  const playBtn = host.querySelector('#sp-play');

  const updateBar = (f) => {
    if (!f.barEl) return;
    const pct = f.maxHp ? Math.max(0, f.hp / f.maxHp * 100) : 0;
    f.barEl.style.width = pct + '%';
    f.barEl.classList.toggle('low', pct < 25);
    if (f.valEl) f.valEl.textContent = Math.round(f.hp);
  };
  const flash = (f, cls) => {
    if (!f.rowEl) return;
    f.rowEl.classList.remove('hit','crit','dodge'); void f.rowEl.offsetWidth;
    f.rowEl.classList.add(cls);
    setTimeout(() => f.rowEl && f.rowEl.classList.remove(cls), 200);
  };
  const appendFeed = (html) => {
    feed.insertAdjacentHTML('beforeend', html);
    while (feed.children.length > 240) feed.firstChild.remove();
    feed.scrollTop = feed.scrollHeight;
  };

  const renderCol = (host2, list, side) => {
    const shown = list.slice(0, SIM_ROW_CAP);
    host2.innerHTML = `<h4>${side === 'left' ? 'Команда A' : 'Команда B'} · ${list.length}</h4>` +
      shown.map((f) => `<div class="sim-fighter ${side}" data-fid="${esc(f.id)}">
        <span class="sim-fname">${esc(f.name)}</span>
        <span class="sim-hp" data-hp>${Math.round(f.maxHp)}</span>
        <div class="sim-fbar"><i style="width:100%"></i></div></div>`).join('') +
      (list.length > shown.length ? `<div class="muted" style="font-size:11px">…ещё ${list.length - shown.length} (без полос)</div>` : '');
    shown.forEach((f) => {
      const st = S.fmap[f.id];
      st.rowEl = host2.querySelector(`[data-fid="${CSS.escape(String(f.id))}"]`);
      st.barEl = st.rowEl ? st.rowEl.querySelector('.sim-fbar i') : null;
      st.valEl = st.rowEl ? st.rowEl.querySelector('[data-hp]') : null;
    });
  };

  const load = (idx) => {
    pause();
    S.idx = idx; S.ev = 0; S.lastTurn = 0;
    const tl = S.tl = S.timelines[idx];
    S.fmap = {};
    for (const side of ['left','right'])
      for (const f of tl.fighters[side])
        S.fmap[f.id] = { id:f.id, name:f.name, side, maxHp:f.maxHp, hp:f.maxHp, alive:true };
    renderCol(host.querySelector('#sp-left'), tl.fighters.left, 'left');
    renderCol(host.querySelector('#sp-right'), tl.fighters.right, 'right');
    feed.innerHTML = '';
    if (tl.truncated) appendFeed('<div class="fl muted">запись усечена — показаны первые удары</div>');
    progress();
  };

  const progress = () => {
    const n = S.tl ? S.tl.events.length : 0;
    progEl.textContent = `удар ${S.ev}/${n}`;
  };

  const step = () => {
    const tl = S.tl;
    if (S.ev >= tl.events.length){ pause(); endLine(); return; }
    const e = tl.events[S.ev++];
    if (e.t !== S.lastTurn){ S.lastTurn = e.t;
      appendFeed(`<div class="fl"><span class="tn">— ход ${e.t} —</span></div>`); }
    const d = S.fmap[e.d], a = S.fmap[e.a];
    const an = a ? a.name : e.a, dn = d ? d.name : e.d;
    const z = SIM_ZONE[e.zone] || e.zone;
    let cls = '', txt;
    if (e.dodged){ cls = 'dodge'; txt = `${dn} уклоняется от ${an}`; if (d) flash(d, 'dodge'); }
    else {
      if (d){ d.hp = e.hp; updateBar(d); flash(d, e.crit ? 'crit' : 'hit'); }
      if (e.crit){ cls = 'crit'; txt = `${an} КРИТ по ${dn} в ${z} −${e.dmg}`; }
      else if (e.blocked){ cls = 'block'; txt = `${dn} блокирует ${an} в ${z} −${e.dmg}`; }
      else txt = `${an} бьёт ${dn} в ${z} −${e.dmg}`;
    }
    if (e.killed && d){ d.alive = false; if (d.rowEl) d.rowEl.classList.add('dead'); }
    if (e.killed){ cls = 'kill'; txt += ' ✖ повержен'; }
    appendFeed(`<div class="fl ${cls}">${e.counter ? '↩ ' : ''}${esc(txt)}</div>`);
    progress();
  };

  const endLine = () => {
    const win = S.tl.winner;
    appendFeed(`<div class="fl kill">— бой окончен: ${win ? 'победа ' + (win === 'left' ? 'A' : 'B') : 'ничья'} —</div>`);
    playBtn.textContent = '▶ Старт';
  };

  const play = () => {
    if (S.playing) return;
    if (S.ev >= S.tl.events.length) load(S.idx);   // с конца — начать заново
    S.playing = true; playBtn.textContent = '❚❚ Пауза';
    S.timer = setInterval(step, S.speed);
  };
  function pause(){
    S.playing = false; if (S.timer){ clearInterval(S.timer); S.timer = null; }
    if (playBtn) playBtn.textContent = '▶ Старт';
  }

  host.querySelector('#sp-play').onclick = () => (S.playing ? pause() : play());
  host.querySelector('#sp-restart').onclick = () => { load(S.idx); };
  host.querySelector('#sp-battle').onchange = (e) => load(+e.target.value);
  host.querySelector('#sp-speed').oninput = (e) => {
    S.speed = +e.target.value;
    if (S.playing){ clearInterval(S.timer); S.timer = setInterval(step, S.speed); }
  };

  SP = { destroy(){ pause(); host.remove(); } };
  load(0);
}

/* ================= Живой бой (интерактивный движок) ================= *

 * баги боя/эффектов, играя за всех. См. ТЗ #12.

let LS = null;

// Пояс расходников живого боя (параметры как в migrate.js/belt.js). Заряды в

const LS_ZONES = ['high','mid','low'];
const LS_ZL = { high:'голова', mid:'корпус', low:'ноги' };

window.LS_preset = (l, r) => { $('#ls-nl').value = l; $('#ls-nr').value = r; LS_start(); };
window.LS_start = async () => {
  if (LS){ LS.destroy(); LS = null; }
  const nl = +$('#ls-nl').value || 1, nr = +$('#ls-nr').value || 1;
  const tt = Math.max(3, +$('#ls-tt').value || 20);

class LiveSim {
  constructor(Engine, nl, nr, turnTime){
    this.turnTime = turnTime;
    this.over = false;
    this.step = 0;
    this.sel = {};            // id -> { attack, block } (выбор зон в окне)
    this.cd = {};             // id -> { kind -> ts } тайм-аут свитков
    this.refs = {};           // id -> ссылки на DOM окна
    const mk = (side, i) => ({
      id: `${side[0]}${i+1}`, name: `${side==='left'?'Альфа':'Бета'} ${i+1}`,
      level: 1, isAI: false, hp: 2330, maxHp: 2330,
      damage: [160, 240], crit: 0.14, dodge: 0.07,
      initiative: 10 - i + Math.random(), mp: 40, maxMp: 100,
    });
    const left = Array.from({ length: nl }, (_, i) => mk('left', i));
    const right = Array.from({ length: nr }, (_, i) => mk('right', i));
    this.engine = new Engine({ left, right }, { turnTime });
    for (const f of this.engine.fighters.values()){
      this.sel[f.id] = { attack: 'mid', block: 'mid' };
      this.cd[f.id] = {};
    }
    this.auto = new Set();    // id бойцов на автоударе
  }

  fighter(id){ return this.engine.fighter(id); }
  order(){ return [...this.engine.teams.left, ...this.engine.teams.right]; }

  begin(){
    this.buildPanels();
    this.lastEff = Date.now();
    this.effTimer = setInterval(() => this.onEffectTick(), 1000);
    this.feed('Бой начался.', 'sys');
    this.beginRound();
  }

  destroy(){
    this.over = true;
    clearInterval(this.timer); clearInterval(this.effTimer);
    const g = $('#ls-grid'); if (g) g.innerHTML = '';
  }

  /* ---- цикл хода (зеркало manager.js, но в браузере) ---- */
  beginRound(){
    const t = this.engine.startRound();
    if (!t){ if (this.engine.finished()) return this.end(); return; }
    this.enterActor();
  }
  enterActor(){
    this.step += 1;
    let af = this.engine.currentActor();
    if (!af){
      const next = this.engine.advance();
      if (!next){ if (this.engine.finished()) return this.end(); return this.beginRound(); }
      af = this.engine.currentActor();
    }
    if (!af) return;
    this.activeId = af.id;
    this.turnEndsAt = Date.now() + this.turnTime * 1000;
    this.refresh();
    this.startTimer();
    if (this.auto.has(af.id)){
      const step = this.step;
      setTimeout(() => {
        if (!this.over && this.step === step && this.auto.has(af.id)) this.autoAct(af.id);
      }, 550);
    }
  }
  startTimer(){
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      if (this.over) return clearInterval(this.timer);
      const left = Math.max(0, Math.ceil((this.turnEndsAt - Date.now()) / 1000));
      this.setTimer(left);
      if (left <= 0){ clearInterval(this.timer); this.onTimeout(); }
    }, 250);
  }
  onTimeout(){
    if (this.over || this.engine.phase !== 'choose') return;
    const af = this.engine.currentActor();
    if (!af){ const n = this.engine.advance(); return n ? this.enterActor() : this.beginRound(); }
    if (this.auto.has(af.id)) return this.autoAct(af.id);
    this.feed(`<b>${esc(af.name)}</b> прозевал ход (тайм-аут).`, 'sys');
    this.engine.submit(af.id, { pass: true });
    this.resolveCurrent();
  }
  autoAct(id){
    if (this.over || this.engine.phase !== 'choose' || this.engine.currentActorId() !== id) return;
    const af = this.fighter(id);
    if (!af || !af.alive) return;
    // эликсиры как ИИ: мощь — если буффа нет; жизнь — если HP низкое
    if (af.buffTurns <= 0) this.useElixir(id, 0, true);
    if (af.hp <= af.maxHp * 0.5) this.useElixir(id, 1, true);
    this.engine.submit(id, this.engine.aiMove());
    this.resolveCurrent();
  }
  submitHuman(id){
    if (this.over || this.engine.phase !== 'choose' || this.engine.currentActorId() !== id) return;
    const s = this.sel[id] || { attack:'mid', block:'mid' };
    if (!this.engine.submit(id, { attack: s.attack, block: s.block })) return stamp('Ход отклонён движком', true);
    this.resolveCurrent();
  }
  passHuman(id){
    if (this.over || this.engine.phase !== 'choose' || this.engine.currentActorId() !== id) return;
    this.engine.submit(id, { pass: true });
    this.resolveCurrent();
  }
  resolveCurrent(){
    if (this.engine.phase !== 'choose') return;
    clearInterval(this.timer);
    const r = this.engine.resolveActive();
    for (const st of r.strikes){
      const a = this.fighter(st.attackerId), d = this.fighter(st.defenderId);
      const cls = st.killed ? 'kill' : st.crit ? 'crit' : '';
      let txt;
      if (st.dodged) txt = `<b>${esc(d.name)}</b> уклонился от удара <b>${esc(a.name)}</b>`;
      else if (st.blocked) txt = `<b>${esc(a.name)}</b> → ${LS_ZL[st.zone]}: блок −${st.damage}`;
      else txt = `<b>${esc(a.name)}</b> → ${LS_ZL[st.zone]}${st.crit?' КРИТ':''}: −${st.damage}`;
      if (st.counter) txt = '↩ ' + txt;
      this.feed(txt + (st.killed ? ` — <b>${esc(d.name)}</b> повержен!` : ''), cls);
    }
    for (const id of r.passed) this.feed(`<b>${esc(this.fighter(id).name)}</b> пропускает ход.`, 'sys');
    this.refresh();
    const step = this.step;
    setTimeout(() => { if (!this.over && this.step === step) this.advance(); }, 650);
  }
  advance(){
    if (this.engine.phase !== 'resolving') return;
    if (this.engine.finished()) return this.end();
    const next = this.engine.advance();
    if (next) this.enterActor(); else this.beginRound();
  }

  /* ---- эффекты по времени (тот же engine.tickEffects) ---- */
  onEffectTick(){
    if (this.over) return;
    const now = Date.now();
    const dt = now - this.lastEff; this.lastEff = now;
    const res = this.engine.tickEffects(dt);
    for (const f of res.changed){
      const d = Math.round(f._effDelta || 0);
      if (d) this.feed(`<b>${esc(f.name)}</b> ${d>0?'+':''}${d} HP (эффект)`, 'fx');
    }
    for (const k of res.kills){
      const v = this.fighter(k.victimId);
      if (v) this.feed(`<b>${esc(v.name)}</b> погиб от яда.`, 'kill');
    }
    this.refresh();
    if (res.deaths.length){
      if (this.engine.finished()) return this.end();
      if (this.engine.phase === 'choose' && !this.engine.currentActor()){
        const n = this.engine.advance(); n ? this.enterActor() : this.beginRound();
      }
    }
  }

  /* ---- использование расходника (любым бойцом, в любой ход) ---- */
  useElixir(id, idx, silent){
    const f = this.fighter(id); if (!f || !f.alive) return;
    const e = LS_BELT[idx]; if (!e) return;
    const now = Date.now();
    if (LS_SCROLL(e.kind) && (this.cd[id][e.kind] || 0) > now){
      if (!silent) stamp('Свиток на перезарядке', true); return;
    }
    const eng = this.engine, q = idx + 1;
    let tgt = f;
    if (e.kind === 'poison' || e.kind === 'cleanse')
      tgt = eng.opponentOf(id) || eng.enemiesOf(id)[0] || null;
    if (!tgt){ if (!silent) stamp('Нет цели', true); return; }
    if (e.kind === 'power') eng.addBuff(id, e.mult, e.turns, q);
    else if (e.kind === 'blood') eng.addCritBuff(id, e.crit_add, e.turns, q);
    else if (e.kind === 'health' || e.kind === 'heal_scroll')
      eng.addOverTime(id, e.kind, Math.round(f.maxHp * e.heal_pct), e.secs*1000, id, e.kind==='heal_scroll', q, e.tick*1000);
    else if (e.kind === 'mana')
      eng.addOverTime(id, 'mana', Math.round(f.maxMp * e.mana_pct), e.secs*1000, id, false, q, e.tick*1000);
    else if (e.kind === 'poison')
      eng.addOverTime(tgt.id, 'poison', Math.round(tgt.maxHp * e.dmg_pct), e.secs*1000, id, true, q, e.tick*1000);
    else if (e.kind === 'cleanse') eng.cleanse(tgt.id, ['poison','heal_scroll']);
    if (LS_SCROLL(e.kind)) this.cd[id][e.kind] = now + (e.cooldown||30)*1000;
    const tn = tgt !== f ? ` → <b>${esc(tgt.name)}</b>` : '';
    this.feed(`<b>${esc(f.name)}</b>: ${e.name}${tn}`, 'fx');
    this.refresh();
  }

  end(){
    if (this.over) return;
    this.over = true;
    clearInterval(this.timer); clearInterval(this.effTimer);
    const w = this.engine.winner();
    const ban = $('#ls-banner');
    if (ban){ ban.style.display = ''; ban.textContent = w
      ? `Победа стороны: ${w==='left'?'СЛЕВА':'СПРАВА'}` : 'Ничья'; }
    this.setTimer(0);
    this.refresh();
    this.feed('Бой завершён.', 'sys');
  }

  /* ---- DOM: окна строятся ОДИН раз, дальше точечно обновляются ---- */
  buildPanels(){
    const grid = $('#ls-grid'); if (!grid) return;
    grid.innerHTML = '';
    this.refs = {};
    for (const id of this.order()){
      const f = this.fighter(id);
      const side = f.side;
      const panel = document.createElement('div');
      panel.className = 'ls-panel ' + side;
      panel.innerHTML = `
        <div class="ls-head">
          <span class="ls-name">${esc(f.name)}</span>
          <span class="ls-tag">${side==='left'?'СЛЕВА':'СПРАВА'}</span>
          <label class="ls-auto"><input type="checkbox" data-auto> Авто</label>
        </div>
        <div class="ls-bars">
          <div class="ls-bar hp"><i></i><span data-hp></span></div>
          <div class="ls-bar mp"><i></i><span data-mp></span></div>
        </div>
        <div class="ls-fx" data-fx></div>
        <div class="ls-zones" data-zones>
          <div class="ls-zrow"><b>Удар</b><div class="ls-zbtns" data-atk></div></div>
          <div class="ls-zrow"><b>Блок</b><div class="ls-zbtns" data-blk></div></div>
        </div>
        <div class="ls-act">
          <button class="strike" data-strike>Удар</button>
          <button data-pass>Пропуск</button>
        </div>
        <div class="ls-belt" data-belt></div>
        <div class="ls-stats" data-stats></div>`;
      grid.appendChild(panel);
      const q = (s) => panel.querySelector(s);
      const ref = { panel, hpI: q('.hp i'), hpT: q('[data-hp]'), mpI: q('.mp i'),
        mpT: q('[data-mp]'), fx: q('[data-fx]'), atk: q('[data-atk]'),
        blk: q('[data-blk]'), strike: q('[data-strike]'), pass: q('[data-pass]'),
        belt: q('[data-belt]'), auto: q('[data-auto]'), zones: q('[data-zones]') };
      // зоны удара/блока
      for (const z of LS_ZONES){
        const ab = document.createElement('button'); ab.textContent = LS_ZL[z];
        ab.onclick = () => { this.sel[id].attack = z; this.refresh(); };
        ref.atk.appendChild(ab);
        const bb = document.createElement('button'); bb.textContent = LS_ZL[z];
        bb.onclick = () => { this.sel[id].block = z; this.refresh(); };
        ref.blk.appendChild(bb);
      }
      ref.strike.onclick = () => this.submitHuman(id);
      ref.pass.onclick = () => this.passHuman(id);
      ref.auto.onchange = (ev) => {
        if (ev.target.checked) this.auto.add(id); else this.auto.delete(id);
        // если включили авто на активном бойце — пусть сразу ходит
        if (ev.target.checked && this.engine.currentActorId() === id && this.engine.phase === 'choose')
          this.autoAct(id);
        this.refresh();
      };
      // пояс
      LS_BELT.forEach((e, i) => {
        const b = document.createElement('button');
        b.innerHTML = `${esc(e.name)}<span class="q">Q${i+1}</span>`;
        b.onclick = () => this.useElixir(id, i);
        ref.belt.appendChild(b);
      });
      ref._belt = [...ref.belt.children];
      // правка статов в реальном времени
      this.buildStats(panel.querySelector('[data-stats]'), id);
      this.refs[id] = ref;
    }
    this.refresh();
  }

  buildStats(host, id){
    const f = this.fighter(id);
    const row = (label, val, on) => {
      const w = document.createElement('div'); w.className = 's';
      const l = document.createElement('label'); l.textContent = label;
      const inp = document.createElement('input'); inp.type = 'number'; inp.value = val;
      inp.onchange = () => on(parseFloat(inp.value));
      w.append(l, inp); return w;
    };
    host.append(
      row('Макс.HP', f.maxHp, (v) => { f.maxHp = Math.max(1, v|0); f.hp = Math.min(f.hp, f.maxHp); this.refresh(); }),
      row('Урон min', f.damage[0], (v) => { f.damage[0] = Math.max(1, v|0); }),
      row('Урон max', f.damage[1], (v) => { f.damage[1] = Math.max(f.damage[0], v|0); }),
      row('Крит %', Math.round(f.crit*100), (v) => { f.crit = Math.max(0, Math.min(100, v))/100; }),
      row('Уворот %', Math.round(f.dodge*100), (v) => { f.dodge = Math.max(0, Math.min(100, v))/100; }),
      row('Макс.мана', f.maxMp, (v) => { f.maxMp = Math.max(0, v|0); f.mp = Math.min(f.mp, f.maxMp); this.refresh(); }),
      row('Уровень', f.level, (v) => { f.level = Math.max(1, v|0); }),
      row('Иниц.', Math.round(f.initiative), (v) => { f.initiative = v; }),
    );
  }

  fxChips(f){
    const out = [];
    if (f.buffTurns > 0) out.push({ t:`Мощь +${Math.round((f.buffMult-1)*100)}% (${f.buffTurns})`, k:'buff' });
    if (f.critBuffTurns > 0) out.push({ t:`Крит +${Math.round(f.critBuffAdd*100)}% (${f.critBuffTurns})`, k:'buff' });
    const lab = { health:'Лечение', heal_scroll:'Исцел.', mana:'Мана', poison:'Яд' };
    for (const e of f.effects || []){
      const rem = Math.ceil((e.durationMs - e.elapsedMs) / 1000);
      const every = Math.round((e.stepMs || 5000) / 1000);
      out.push({ t:`${lab[e.kind]||e.kind} ${rem}c·каждые ${every}c`, k: e.kind==='poison'?'debuff':'buff' });
    }
    return out;
  }

  refresh(){
    const activeId = this.engine.phase === 'choose' ? this.engine.currentActorId() : null;
    for (const id of this.order()){
      const f = this.fighter(id), r = this.refs[id]; if (!r) continue;
      const hpPct = f.maxHp ? Math.max(0, f.hp/f.maxHp*100) : 0;
      r.hpI.style.width = hpPct + '%'; r.hpI.classList.toggle('low', hpPct < 25);
      r.hpT.textContent = `${Math.max(0,Math.round(f.hp))} / ${f.maxHp}`;
      const mpPct = f.maxMp ? Math.max(0, f.mp/f.maxMp*100) : 0;
      r.mpI.style.width = mpPct + '%';
      r.mpT.textContent = f.maxMp ? `${Math.round(f.mp)} / ${f.maxMp} маны` : '—';
      r.fx.innerHTML = this.fxChips(f).map((c) =>
        `<span class="ls-chip ${c.k}">${esc(c.t)}</span>`).join('');
      const isActive = id === activeId, dead = !f.alive, auto = this.auto.has(id);
      r.panel.classList.toggle('active', isActive);
      r.panel.classList.toggle('dead', dead);
      r.auto.checked = auto;
      // зоны/кнопки активны только в свой ход и не на авто
      const canAct = isActive && !dead && !auto && !this.over;
      r.zones.style.opacity = canAct ? '1' : '.45';
      [...r.atk.children].forEach((b, i) => b.classList.toggle('on', this.sel[id].attack === LS_ZONES[i]));
      [...r.blk.children].forEach((b, i) => b.classList.toggle('on', this.sel[id].block === LS_ZONES[i]));
      r.strike.disabled = !canAct; r.pass.disabled = !canAct;
      const now = Date.now();
      r._belt.forEach((b, i) => {
        const e = LS_BELT[i];
        const cd = LS_SCROLL(e.kind) && (this.cd[id][e.kind] || 0) > now;
        b.disabled = dead || this.over || cd;
        b.title = cd ? `Перезарядка ${Math.ceil(((this.cd[id][e.kind])-now)/1000)} c` : '';
      });
    }
  }

  setTimer(left){
    const t = $('#ls-timer'); if (!t) return;
    const af = this.engine.phase === 'choose' ? this.fighter(this.engine.currentActorId()) : null;
    const mmss = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
    t.textContent = this.over ? '' : af ? `Ход: ${af.name} — ${mmss}` : '';
  }

  feed(html, cls){
    const f = $('#ls-feed'); if (!f) return;
    const d = document.createElement('div'); d.className = 'fl ' + (cls||'');
    d.innerHTML = html; f.prepend(d);
    while (f.children.length > 140) f.lastChild.remove();
  }
}

/* характеристики предмета — произвольные пары ключ→значение (число/true/false) */
const STAT_KEYS = {
  defense:'Защита', strength:'Сила', hp:'Здоровье', crit:'Крит (доля 0–1)',
  dodge:'Уворот (доля 0–1)', mp:'Мана', energy:'Энергия',
  heal:'Лечение (эликсир)', power_mult:'Множитель урона (эликсир)',
  power_turns:'Ходов усиления', escape:'Эликсир побега (true)',
};
let _modelFile = null;   // выбранный, но ещё не загруженный файл модели
function statRowHTML(key = '', val = ''){
  return `<div class="stat-row">
    <input class="sx-key" list="stat-keys" placeholder="ключ (hp, defense…)" value="${esc(key)}">
    <input class="sx-val" placeholder="значение" value="${esc(val)}">
    <button type="button" class="sm danger" title="убрать"
      onclick="this.closest('.stat-row').remove()">✕</button></div>`;
}
window.addStatRow = (k = '', v = '') =>
  $('#stat-rows').insertAdjacentHTML('beforeend', statRowHTML(k, v));
function collectStats(){
  const out = {};
  document.querySelectorAll('#stat-rows .stat-row').forEach((row) => {
    const k = row.querySelector('.sx-key').value.trim(); if (!k) return;
    const raw = row.querySelector('.sx-val').value.trim();
    out[k] = raw === 'true' ? true : raw === 'false' ? false
      : (raw !== '' && !isNaN(Number(raw))) ? Number(raw) : raw;
  });
  return out;
}

    </div>

      <button type="button" class="sm" style="margin-left:8px" onclick="addStatRow()">+ строка</button></h3>
    <div id="stat-rows">${rows}</div>
    <p class="muted" style="font-size:11px;margin-top:2px">Любые пары ключ→значение
      (число, true/false). Сервер сольёт их в base_stats предмета.</p>
    <h3 style="margin-top:14px">Требования, чтобы надеть</h3><div class="form">
      <div><label>Мин. уровень</label><input id="r-lvl" type="number" value="${rq.level ?? t.level_req ?? 1}"></div>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <button class="brass" onclick="saveTpl()">Сохранить предмет</button></div></div>

    <div class="panel"><h3>3D-модель и превью</h3>
      <div class="form"><div class="wide">
        <label>Файл модели (GLB / GLTF / FBX)</label>
        <input id="t-model-file" type="file" accept=".glb,.gltf,.fbx">
        <div style="margin-top:8px"><label>URL или ключ модели</label>
          <input id="t-model" value="${esc(t.model||'')}"
            placeholder="/uploads/… или ключ из content.js" style="width:100%"></div>
        <div id="t-model-note" class="muted" style="font-size:11px;margin-top:4px"></div>
      </div></div>
      <div id="t-preview" class="model-preview"><div class="mp-hint">
        Загрузите файл модели или укажите URL — появится вращаемое 3D-превью.</div></div>
    </div>
  </div>`;
  $('#t-model-file').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    _modelFile = f;
    $('#t-model-note').textContent = 'файл выбран: ' + f.name + ' — загрузится при сохранении';
    mountModelPreview($('#t-preview'), URL.createObjectURL(f), modelExt(f.name));
  });
  if (isUrl) mountModelPreview($('#t-preview'), t.model, modelExt(t.model));
};
window.saveTpl = async () => {
  let model = $('#t-model').value.trim() || null;
  if (_modelFile){
    try { model = await upload(_modelFile); _modelFile = null; }
    catch (e) { return fail(e); }
  }
  const lvl = +$('#r-lvl').value || 1;
  const body = {
    id: +$('#t-id').value, name: $('#t-name').value.trim(),
    type: +$('#t-type').value, slot: $('#t-slot').value ? +$('#t-slot').value : null,
    quality: +$('#t-q').value, icon: $('#t-icon').value.trim() || null,
    stackable: $('#t-stack').value === '1', max_stack: +$('#t-maxstack').value || 1,
    price: +$('#t-price').value || 0,
    level_req: lvl, requirements: { level: lvl },
    base_stats: collectStats(), model,
  };
  if (!body.id || !body.name) return stamp('Отказано · нужны ID и название', true);
  try { await api('/item-templates', body); ok('предмет #' + body.id); show('items'); }
  catch (e) { fail(e); }
};
window.giveTpl = async (tplId) => {
  const r = await formModal({ title: 'Выдать предмет игроку', submit: 'Выдать', fields: [
    { key:'character_id', label:'Игрок', type:'player', required:true },
    { key:'quantity', label:'Количество', type:'number', value:1 },
  ]});
  if (!r) return;
  try { const x = await api(`/characters/${r.character_id}/give-item`,
      { template_id: tplId, quantity: r.quantity || 1 });

};
window.tplInstances = async (tplId) => {

  $('#main').innerHTML = `
  <div class="toolbar"><button onclick="openTpl(${tplId})">← К предмету</button>
    <h2 style="margin:0;font-family:Georgia,serif;font-variant:small-caps">
      Экземпляры шаблона #${tplId}</h2></div>

    {h:'Где',v:r=>dict(D.owner,r.owner_type)},{h:'Кол-во',v:r=>r.quantity},

/* ================= Задания ================= */
R.quests = async () => {
  const rows = await api('/quests');
  return `<div class="toolbar"><button class="brass" onclick="editQuest()">Новое задание</button>
    <span class="muted">Задания отслеживаются у игроков автоматически; награда приходит сразу.</span></div>
  ${table([
    {h:'ID',v:r=>r.id},{h:'Название',v:r=>r.name},
    {h:'Вкл',html:r=>`<td>${r.active?'<span class="credit">да</span>':'<span class="muted">нет</span>'}</td>`},
    {h:'Уровень',v:r=>r.level_req},{h:'Повтор',v:r=>dict(D.rep,r.repeatable)},
    {h:'Цель',v:r=>`побед в охоте: ${(r.objectives||{}).count ?? 1}`},
    {h:'Награда',v:r=>{const w=r.rewards||{};return [w.copper&&w.copper+' меди',
      w.exp&&w.exp+' опыта',(w.items||[]).length&&'предметы'].filter(Boolean).join(', ')||'—';}},
    {h:'Выполнили',v:r=>r.completed_by},
  ], rows, (r)=>`class="click" onclick="openQuest(${r.id})"`)}`;
};
window.openQuest = async (id) => {
  const rows = await api('/quests');
  editQuest(rows.find((x) => x.id === id));
};
window.editQuest = (r) => {
  const q = r || { id:'', name:'', description:'', image:'', level_req:1,
    repeatable:2, active:true, objectives:{kind:'hunt_wins',count:3},
    rewards:{copper:100,exp:200,items:[]} };
  const w = q.rewards || {};
  $('#main').innerHTML = `
  <div class="toolbar"><button onclick="show('quests')">← К списку</button>
    <h2 style="margin:0;font-family:Georgia,serif;font-variant:small-caps">
      ${r ? 'Задание #' + q.id : 'Новое задание'}</h2></div>
  <div class="panel"><div class="form">
    <div><label>Уникальный ID</label><input id="q-id" type="number" value="${q.id}" ${r?'disabled':''}></div>
    <div class="wide"><label>Название</label><input id="q-name" value="${esc(q.name)}" style="width:100%"></div>
    <div class="wide"><label>Описание (видно игроку)</label>
      <textarea id="q-desc" rows="3">${esc(q.description||'')}</textarea></div>
    <div><label>Мин. уровень</label><input id="q-lvl" type="number" value="${q.level_req}"></div>
    <div><label>Повторяемость</label><select id="q-rep">${opt(D.rep, q.repeatable)}</select></div>
    <div><label>Включено</label><select id="q-active">
      <option value="1" ${q.active?'selected':''}>да</option>
      <option value="0" ${!q.active?'selected':''}>нет</option></select></div>
    <div><label>Цель: побед в охоте</label>
      <input id="q-count" type="number" value="${(q.objectives||{}).count ?? 1}"></div>
    <div><label>Награда: медь</label><input id="q-copper" type="number" value="${w.copper ?? 0}"></div>
    <div><label>Награда: опыт</label><input id="q-exp" type="number" value="${w.exp ?? 0}"></div>
    <div class="wide"><label>Награда: ID предметов через запятую</label>
      <input id="q-items" value="${esc((w.items||[]).join(', '))}" style="width:100%"></div>
    <div class="wide"><label>Картинка</label>
      <input id="q-file" type="file" accept="image/*">
      <input id="q-image" value="${esc(q.image||'')}" placeholder="/uploads/..." style="width:60%">
      ${q.image ? `<div style="margin-top:8px"><img src="${esc(q.image)}"
        style="max-height:110px;border:1px solid var(--line);border-radius:3px"></div>` : ''}</div>
  </div>
  <div class="toolbar" style="margin-top:12px">
    <button class="brass" onclick="saveQuest()">Сохранить задание</button></div></div>`;
  $('#q-file').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { $('#q-image').value = await upload(f); ok('картинка загружена'); }
    catch (err) { fail(err); }
  });
};
window.saveQuest = async () => {
  const body = {
    id: +$('#q-id').value, name: $('#q-name').value.trim(),
    description: $('#q-desc').value.trim(), image: $('#q-image').value.trim() || null,
    level_req: +$('#q-lvl').value || 1, repeatable: +$('#q-rep').value,
    active: $('#q-active').value === '1',
    objectives: { kind: 'hunt_wins', count: +$('#q-count').value || 1 },
    rewards: { copper: +$('#q-copper').value || 0, exp: +$('#q-exp').value || 0,
      items: $('#q-items').value.split(',').map((s)=>+s.trim()).filter(Boolean) },
  };
  if (!body.id || !body.name) return stamp('Отказано · нужны ID и название', true);
  try { await api('/quests', body); ok('задание #' + body.id); show('quests'); }
  catch (e) { fail(e); }
};

/* ================= Конфиг: живой баланс без деплоя ================= */
const CFG_FORMS = {
  'battle.turn_time': { title: 'Время хода в бою, секунд',
    render: (v) => `<input data-k="0" type="number" value="${v}">`,
    collect: (g) => +g(0) },
  'battle.reward.hunt': { title: 'Награда за победу в охоте',
    render: (v) => `<div><label>Меди</label><input data-k="0" type="number" value="${v.amount}"></div>
      <div><label>Опыта</label><input data-k="1" type="number" value="${v.exp}"></div>`,
    collect: (g) => ({ currency: 'copper', amount: +g(0), exp: +g(1) }) },
  'character.leveling': { title: 'Шкала уровней',
    render: (v) => `<div><label>Макс. уровень</label><input data-k="0" type="number" value="${v.maxLevel ?? 15}"></div>
      <div><label>Пороги опыта</label><textarea data-k="1" rows="3">${(v.thresholds || []).join(', ')}</textarea></div>`,
    collect: (g) => ({ maxLevel: +g(0), thresholds: g(1).split(',')
      .map((x) => +x.trim()).filter((x) => Number.isFinite(x)) }) },
  'battle.escape_elixir': { title: 'ID шаблона Эликсира побега',
    render: (v) => `<input data-k="0" type="number" value="${v}">`,
    collect: (g) => +g(0) },
  'character.start': { title: 'Стартовый персонаж',
    render: (v) => `<div><label>Уровень</label><input data-k="0" type="number" value="${v.level}"></div>
      <div><label>HP</label><input data-k="1" type="number" value="${v.hp}"></div>
      <div><label>Урон от</label><input data-k="2" type="number" value="${v.damage[0]}"></div>
      <div><label>Урон до</label><input data-k="3" type="number" value="${v.damage[1]}"></div>
      <div><label>Крит (0–1)</label><input data-k="4" type="number" step="0.01" value="${v.crit}"></div>
      <div><label>Уворот (0–1)</label><input data-k="5" type="number" step="0.01" value="${v.dodge}"></div>`,
    collect: (g, old) => ({ ...old, level:+g(0), hp:+g(1),
      damage:[+g(2), +g(3)], crit:+g(4), dodge:+g(5) }) },
  'chat.history_limit': { title: 'Сколько сообщений чата отдавать при входе',
    render: (v) => `<input data-k="0" type="number" value="${v}">`,
    collect: (g) => +g(0) },
};
let CFG_RAW = {};
R.config = async () => {
  const rows = await api('/config');
  CFG_RAW = Object.fromEntries(rows.map((r) => [r.key, r.value]));
  return `<div class="panel"><h3>Что это</h3>
    <p class="muted" style="margin:0">Конфиг — живой баланс игры: цифры, которые сервер
    читает из базы, а не из кода. Поменял значение → «Сохранить» → сервер подхватил
    сразу, без пересборки и перезапуска. Каждое изменение попадает в аудит.</p></div>
  ${rows.map((r) => {
    const f = CFG_FORMS[r.key];
    const body = f
      ? `<div class="form" data-key="${esc(r.key)}">${f.render(r.value)}</div>`
      : `<textarea rows="2" data-key="${esc(r.key)}" data-json>${esc(JSON.stringify(r.value))}</textarea>`;
    return `<div class="panel"><h3>${f ? f.title : r.key}
        <span class="muted" style="font-size:11px">· ${esc(r.key)} · v${r.version}</span></h3>
      ${body}
      <div class="toolbar" style="margin-top:10px">
        <button class="brass" onclick="saveCfg('${esc(r.key)}')">Сохранить</button>
        <span class="muted">изменён: ${dt(r.updated_at)}</span></div></div>`;
  }).join('')}`;
};
window.saveCfg = async (key) => {
  const f = CFG_FORMS[key];
  let value;
  if (f) {
    const box = document.querySelector(`[data-key="${key}"]`);
    const g = (i) => box.querySelector(`[data-k="${i}"]`).value;
    value = f.collect(g, CFG_RAW[key]);
  } else {
    try { value = JSON.parse(document.querySelector(`[data-key="${key}"][data-json]`).value); }
    catch { return stamp('Отказано · это не JSON', true); }
  }
  try { await api('/config', { key, value }); ok('config ' + key); }
  catch (e) { fail(e); }
};

R.audit = async () => table([
  {h:'№',v:r=>r.id},{h:'Когда',v:r=>dt(r.ts)},{h:'Действие',v:r=>r.action},
  {h:'Цель',v:r=>r.target_id ? '#' + r.target_id : '—'},

/* ================= навигация и вход ================= */
window.show = async (name, arg) => {
  current = name;
  disposePreview();   // уходим со страницы предмета — гасим 3D-цикл превью
  if (SP){ SP.destroy(); SP = null; }   // и таймер 2D-проигрывателя симуляции
  if (LS){ LS.destroy(); LS = null; }   // и живой бой (таймеры/тикеры)
  document.querySelectorAll('#nav button').forEach((b) =>
    b.classList.toggle('active', b.dataset.s === name));
  $('#hdr-title').textContent = SECTIONS.find(([k]) => k === name)[1];
  $('#main').innerHTML = '<p class="muted">Листаем книгу…</p>';
  try { $('#main').innerHTML = await R[name](arg); }
  catch (e) { $('#main').innerHTML =
    `<p class="debit">Не удалось загрузить: ${esc(e.message)}</p>`; }
};
$('#nav').innerHTML = SECTIONS.map(([k, t]) =>
  `<button data-s="${k}" onclick="show('${k}')">${t}</button>`).join('');

function logout(){
  KEY = ''; sessionStorage.removeItem('adminKey');
  $('#app').style.display = 'none'; $('#login').style.display = 'flex';
}
async function enter(){
  $('#login').style.display = 'none'; $('#app').style.display = 'grid';
  show('stats');
  setInterval(() => { if (current === 'stats') show('stats'); }, 15000);
}
$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  KEY = $('#login-pass').value;
  try { await api('/login', { password: KEY });
    sessionStorage.setItem('adminKey', KEY); enter(); }
  catch (err) { $('#login-err').textContent =
    err.message === 'admin_disabled'
      ? 'Админка выключена: задай ADMIN_PASSWORD в .env'
      : 'Пароль не подходит'; }
});

/** Вход через Telegram (без пароля): initData из WebApp ИЛИ из hash (#tginit),
 *  когда перешли из игры. Меняем подпись на токен-ключ. */
async function tryTelegramLogin(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg){ try { tg.ready(); tg.expand(); } catch (e) {} }
  const fromHash = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('tginit');
  const initData = (tg && tg.initData) || fromHash || '';
  if (!initData) return false;
  try {
    const r = await fetch('/admin/api/telegram-login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.key){
      KEY = d.key; sessionStorage.setItem('adminKey', KEY);
      history.replaceState(null, '', location.pathname);   // убрать initData из URL
      return true;
    }
  } catch (e) {}
  return false;
}

// Старт: вход через Telegram (initData/hash); иначе сохранённый ключ; иначе форма.
(async () => {
  if (await tryTelegramLogin()){ enter(); return; }
  if (KEY){ try { await api('/stats'); enter(); return; } catch (e) {} }
  logout();
})();
</script>
