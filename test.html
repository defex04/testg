<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бой</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0b0b14;
    --panel: transparent;
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.25);
    --gold-border: rgba(201, 168, 76, 0.62);
    --gold-glow: rgba(201, 168, 76, 0.14);
    --red-hp: #d14535;
    --red-glow: rgba(191,58,43,0.35);
    --energy: #3a8fd4;
    --energy-glow: rgba(58,143,212,0.3);
    --text: #ddd8c8;
    --gap: 8px;
    --app-h: 100dvh;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: transparent;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: var(--app-h);
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .wrapper {
    position: relative;
    z-index: 2;
    width: min(100vw, calc(var(--app-h) * 9 / 16));
    height: min(var(--app-h), calc(100vw * 16 / 9));
    max-height: calc(100vw * 16 / 9);
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* === Панели HUD === */
  .battle-panel,
  .battle-arena {
    background: transparent;
    border: 1.5px solid var(--gold-border);
    border-radius: 14px;
    box-shadow:
      0 0 18px var(--gold-glow),
      inset 0 1px 0 rgba(201, 168, 76, 0.15);
  }

  .battle-panel {
    flex: 0 0 auto;
    width: 100%;
    padding: 8px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .battle-arena {
    flex: 1 1 0%;
    min-height: 0;
    width: 100%;
    padding: 8px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* === Окно боя (анимация) === */
  .battle-window {
    flex: 1 1 0%;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: transparent;
  }

  .battle-window-pane {
    min-width: 0;
    min-height: 0;
    position: relative;
    border: 1.5px solid var(--gold-border);
    border-radius: 14px;
    overflow: hidden;
    background: transparent;
    box-shadow:
      0 0 18px var(--gold-glow),
      inset 0 1px 0 rgba(201, 168, 76, 0.15);
  }

  .battle-window-pane.top {
    flex: 2 1 0%;
  }

  .battle-window-pane.bottom {
    flex: 3 1 0%;
  }

  .battle-scene {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .battle-damage-row {
    width: 100%;
    padding-top: 2px;
  }

  .battle-stats-lower {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: 10px;
    width: 100%;
    min-height: calc(2 * (7px * 1.2 + 4px) + 3px);
    padding-top: 4px;
  }

  .battle-stats-lower > .active-effects:first-child {
    justify-self: start;
    min-width: 0;
  }

  .battle-stats-lower > .active-effects:last-child {
    justify-self: end;
    min-width: 0;
    align-items: flex-end;
  }

  .battle-stats-lower > .active-effects:last-child .active-effects-list {
    justify-content: flex-end;
  }

  .dmg-dealt-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    width: 100%;
  }

  .dmg-dealt-inner {
    grid-column: 2;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    justify-content: center;
  }

  .dmg-dealt-label,
  .dmg-dealt-val {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.05em;
    white-space: nowrap;
    background: linear-gradient(180deg, #f8f0d8 0%, #d4b76a 52%, #a8863a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85));
  }

  .dmg-dealt-label {
    font-size: 10px;
  }

  .dmg-dealt-val {
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .battle-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
    column-gap: 8px;
  }

  /* === Колонка бойца === */
  .fighter-col {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .fighter-col.right {
    align-items: flex-end;
    text-align: right;
  }

  /* Шапка: ник + уровень */
  .fighter-head {
    display: flex;
    align-items: baseline;
    gap: 4px;
    width: 100%;
    min-width: 0;
  }

  .fighter-col.right .fighter-head {
    justify-content: flex-end;
  }

  .nick,
  .nick-lvl {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.05em;
    line-height: 1;
    background: linear-gradient(180deg, #f8f0d8 0%, #d4b76a 52%, #a8863a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85));
  }

  .nick-lvl {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .nick {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 0 1 auto;
    max-width: calc(100% - 28px);
  }

  .fighter-col.right .nick {
    text-align: right;
  }

  /* Бары */
  .bars {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .bar-group {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .fighter-col.right .bar-group {
    flex-direction: row-reverse;
  }

  .bar-icon {
    flex-shrink: 0;
    width: 10px;
    font-size: 8px;
    text-align: center;
    line-height: 1;
  }

  .bar-group.bar-hp .bar-icon { color: #e8665a; }
  .bar-group.bar-en .bar-icon { color: #7bb8e0; }

  .bar-track {
    flex: 1;
    min-width: 0;
    height: 18px;
    background: rgba(0,0,0,0.55);
    border-radius: 5px;
    border: 1px solid rgba(201,168,76,0.22);
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.45);
    overflow: hidden;
    position: relative;
  }

  .bar-group.bar-hp .bar-track {
    border-color: rgba(232, 102, 90, 0.5);
    box-shadow:
      inset 0 1px 4px rgba(0,0,0,0.45),
      0 0 5px rgba(191, 58, 43, 0.12);
  }

  .bar-group.bar-en .bar-track {
    border-color: rgba(92, 184, 240, 0.45);
    box-shadow:
      inset 0 1px 4px rgba(0,0,0,0.45),
      0 0 5px rgba(58, 143, 212, 0.1);
  }

  .bar-val {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.95), 0 1px 2px rgba(0,0,0,0.9);
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    position: relative;
    transition: width 0.7s cubic-bezier(.25,.46,.45,.94);
  }

  .bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
    border-radius: 3px 3px 0 0;
  }

  .bar-fill.hp-red {
    background: linear-gradient(90deg, #7a1a1a, var(--red-hp), #e8665a);
    box-shadow: 0 0 6px var(--red-glow);
  }

  .bar-fill.energy {
    background: linear-gradient(90deg, #1a4a7a, var(--energy), #5cb8f0);
    box-shadow: 0 0 6px var(--energy-glow);
  }

  .bar-fill.low { animation: pulse-low 1s ease-in-out infinite; }
  @keyframes pulse-low { 0%,100%{opacity:1} 50%{opacity:.6} }

  .bar-dmg {
    position: absolute;
    top: 0; height: 100%;
    border-radius: 3px;
    background: rgba(255,255,255,0.3);
    transition: width 1s ease-out 0.3s;
    z-index: -1;
  }

  .timer {
    grid-column: 2;
    justify-self: center;
    align-self: center;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 0.5px;
    opacity: 0.85;
    white-space: nowrap;
    padding: 0 4px;
    z-index: 1;
  }

  #timer-val {
    display: inline-block;
    min-width: 3.2em;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .active-effects {
    width: 100%;
    display: flex;
  }

  .active-effects-list {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    gap: 3px;
    width: 100%;
    max-width: 100%;
    min-height: calc(2 * (7px * 1.2 + 4px) + 3px);
  }

  .effect-chip {
    font-size: 7px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.22);
    color: var(--text);
    white-space: nowrap;
    line-height: 1.2;
  }

  .effect-chip.buff { border-color: rgba(109,219,142,0.35); color: #8edda8; }
  .effect-chip.debuff { border-color: rgba(232,102,90,0.35); color: #e89990; }

  .active-effects-empty {
    font-size: 8px;
    color: rgba(221,216,200,0.3);
    font-style: italic;
  }
  @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }

  .timer.urgent {
    color: var(--red-hp);
    opacity: 1;
    animation: blink .5s ease-in-out infinite;
  }

  @media (max-width: 360px) {
    .wrapper { padding-left: 4px; padding-right: 4px; gap: 4px; }
    .battle-panel,
    .battle-arena { padding: 6px; gap: 6px; }
    .battle-body { column-gap: 6px; }
    .nick, .nick-lvl { font-size: 10px; letter-spacing: 0.04em; }
    .timer { font-size: 12px; }
    .battle-stats-lower { column-gap: 6px; }
    .dmg-dealt-label { font-size: 9px; }
    .dmg-dealt-val { font-size: 11px; }
    .active-effects-list {
      min-height: calc(2 * (6px * 1.2 + 4px) + 3px);
    }
    .effect-chip { font-size: 6px; padding: 1px 4px; }
  }

  @media (max-aspect-ratio: 9/16) {
    .wrapper {
      width: 100vw;
      height: min(calc(100vw * 16 / 9), var(--app-h));
      max-height: var(--app-h);
    }
  }

  @media (max-height: 640px) {
    .battle-panel,
    .battle-arena { padding-top: 4px; gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="battle-panel" role="region" aria-label="Статус бойцов">

    <div class="battle-body">

    <!-- Левый боец -->
    <div class="fighter-col left" id="f-left">
      <div class="fighter-head">
        <div class="nick">ИгрокA</div>
        <span class="nick-lvl" id="l-lvl">[15 Ур.]</span>
      </div>
      <div class="bars">
        <div class="bar-group bar-hp">
          <i class="bar-icon fas fa-heart" aria-hidden="true"></i>
          <div class="bar-track">
            <div class="bar-dmg" id="l-hp-dmg" style="width:17.9%"></div>
            <div class="bar-fill hp-red low" id="l-hp-fill" style="width:17.9%"></div>
            <span class="bar-val" id="l-hp-val">448/2500</span>
          </div>
        </div>
        <div class="bar-group bar-en">
          <i class="bar-icon fas fa-bolt" aria-hidden="true"></i>
          <div class="bar-track">
            <div class="bar-fill energy" id="l-en-fill" style="width:45%"></div>
            <span class="bar-val" id="l-en-val">180/400</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Правый боец -->
    <div class="fighter-col right" id="f-right">
      <div class="fighter-head">
        <div class="nick">Разбойник</div>
        <span class="nick-lvl" id="r-lvl">[15 Ур.]</span>
      </div>
      <div class="bars">
        <div class="bar-group bar-hp">
          <i class="bar-icon fas fa-heart" aria-hidden="true"></i>
          <div class="bar-track">
            <div class="bar-dmg" id="r-hp-dmg" style="width:58.4%"></div>
            <div class="bar-fill hp-red" id="r-hp-fill" style="width:58.4%"></div>
            <span class="bar-val" id="r-hp-val">1518/2600</span>
          </div>
        </div>
        <div class="bar-group bar-en">
          <i class="bar-icon fas fa-bolt" aria-hidden="true"></i>
          <div class="bar-track">
            <div class="bar-fill energy" id="r-en-fill" style="width:30%"></div>
            <span class="bar-val" id="r-en-val">90/300</span>
          </div>
        </div>
      </div>
    </div>

    </div><!-- /.battle-body -->

  </div><!-- /.battle-panel -->

  <div class="battle-arena" role="region" aria-label="Статистика и сцена боя">

    <div class="battle-damage-row">
      <div class="dmg-dealt-row">
        <span class="dmg-dealt-inner">
          <span class="dmg-dealt-label">Нанесено урона:</span>
          <span class="dmg-dealt-val" id="l-dmg-dealt">0</span>
        </span>
      </div>
    </div>

    <div class="battle-stats-lower">
      <div class="active-effects">
        <div class="active-effects-list" id="l-effects">
          <span class="effect-chip buff">Щит</span>
          <span class="effect-chip buff">Реген</span>
        </div>
      </div>

      <div class="timer" id="timer">
        <span id="timer-val">0:30</span>
      </div>

      <div class="active-effects">
        <div class="active-effects-list" id="r-effects">
          <span class="effect-chip debuff">Яд</span>
        </div>
      </div>
    </div>

    <div class="battle-window" role="img" aria-label="Окно боя">
      <div class="battle-window-pane top">
        <div id="battle-scene-top" class="battle-scene"></div>
      </div>
      <div class="battle-window-pane bottom">
        <div id="battle-scene-bottom" class="battle-scene"></div>
      </div>
    </div>
  </div><!-- /.battle-arena -->
</div>

<script>
  const data = {
    left:  { hp: 448,  maxHp: 2500, en: 180, maxEn: 400, damageDealt: 0 },
    right: { hp: 1518, maxHp: 2600, en: 90,  maxEn: 300 }
  };

  function updateDamageDealt() {
    $('l-dmg-dealt').textContent = data.left.damageDealt;
  }

  const $ = id => document.getElementById(id);

  function updateBar(side, type) {
    const d = data[side];
    const val = type === 'hp' ? d.hp : d.en;
    const max = type === 'hp' ? d.maxHp : d.maxEn;
    const pct = Math.max(0, (val / max) * 100);

    const prefix = side === 'left' ? 'l' : 'r';
    const fill  = $(prefix + '-' + type + '-fill');
    const dmg   = $(prefix + '-' + type + '-dmg');
    const valEl = $(prefix + '-' + type + '-val');

    if (dmg && type === 'hp') dmg.style.width = fill.style.width;
    fill.style.width = pct + '%';

    if (dmg && type === 'hp') {
      requestAnimationFrame(() => {
        setTimeout(() => { dmg.style.width = pct + '%'; }, 60);
      });
    }

    valEl.textContent = Math.max(0, val) + '/' + max;

    if (type === 'hp') fill.classList.toggle('low', pct < 25);
  }

  let turn = 'left';

  function doTurn() {
    const atkSide = turn;
    const defSide = turn === 'left' ? 'right' : 'left';
    const atkData = data[atkSide];
    const defData = data[defSide];

    const enCost = 12 + Math.floor(Math.random() * 10);
    if (atkData.en >= enCost) {
      atkData.en -= enCost;
      updateBar(atkSide, 'en');

      const base = 60 + Math.floor(Math.random() * 140);
      const isCrit = Math.random() < 0.2;
      const dmg = isCrit ? Math.round(base * 1.8) : base;

      defData.hp = Math.max(0, defData.hp - dmg);
      updateBar(defSide, 'hp');
      if (atkSide === 'left') {
        data.left.damageDealt += dmg;
        updateDamageDealt();
      }

      if (defData.hp <= 0) { clearInterval(interval); return; }
    }

    atkData.en = Math.min(atkData.maxEn, atkData.en + 8);
    updateBar(atkSide, 'en');

    if (Math.random() < 0.25) {
      const heal = 25 + Math.floor(Math.random() * 50);
      defData.hp = Math.min(defData.maxHp, defData.hp + heal);
      updateBar(defSide, 'hp');
    }

    turn = defSide;
  }

  const interval = setInterval(doTurn, 2500);

  let seconds = 30;
  const timerEl = $('timer');
  const timerVal = $('timer-val');

  setInterval(() => {
    seconds--;
    if (seconds < 0) seconds = 30;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    timerVal.textContent = m + ':' + String(s).padStart(2, '0');
    timerEl.classList.toggle('urgent', seconds <= 5);
  }, 1000);
</script>

</body>
</html>
