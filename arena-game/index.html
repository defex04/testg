<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Арена — демо боевого модуля</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- декоративный шрифт с кириллицей; офлайн просто откатится на Georgia -->
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/game.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js"
      }
    }
  </script>
</head>
<body class="booting loc-castle">
  <!-- экран загрузки: виден до завершения входа и подключения к серверу -->
  <div class="boot-screen" id="boot-screen">
    <div class="boot-card">
      <div class="boot-title">⚜ DRAGON ARENA</div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <div class="boot-status" id="boot-status">Загрузка…</div>
    </div>
  </div>

  <script>
    // Открыто двойным кликом (file://)? Браузер в этом режиме блокирует
    // ES-модули и загрузку моделей — игра не может стартовать. Показываем
    // подсказку и сами переходим на локальный сервер (start.bat), как
    // только он поднимется. На http/https (GitHub Pages) скрипт молчит.
    (function () {
      var test = location.search.indexOf('fallback-test') !== -1;
      if (location.protocol !== 'file:' && !test) return;

      var PORTS = [8765, 8000];

      document.addEventListener('DOMContentLoaded', function () {
        var el = document.createElement('div');
        el.className = 'file-helper';
        el.innerHTML =
          '<div class="fh-card">' +
            '<div class="fh-title">⚜ DRAGON ARENA</div>' +
            '<p class="fh-sub">Игра открыта как файл (file://) — в этом режиме браузер запрещает загружать модули и 3D-модели, поэтому бой не стартует.</p>' +
            '<div class="fh-steps">' +
              '<div class="fh-step"><b>1.</b> Запустите <b>start.bat</b> в этой же папке</div>' +
              '<div class="fh-step"><b>2.</b> Эта вкладка сама перейдёт в игру</div>' +
            '</div>' +
            '<div class="fh-status">Ищу запущенный сервер…</div>' +
            '<a class="fh-link" href="http://localhost:8765/">Открыть вручную → localhost:8765</a>' +
            '<p class="fh-note">На GitHub Pages и любом http-хостинге игра работает сразу — ограничение касается только file://.</p>' +
          '</div>';
        document.body.appendChild(el);
        var status = el.querySelector('.fh-status');

        function ping(i) {
          var url = 'http://localhost:' + PORTS[i % PORTS.length] + '/';
          fetch(url, { mode: 'no-cors', cache: 'no-store' }).then(function () {
            status.textContent = 'Сервер найден — открываю игру…';
            status.className = 'fh-status ok';
            if (!test) location.replace(url);
          }).catch(function () {
            status.textContent = 'Жду start.bat… (сервер пока не запущен)';
            setTimeout(function () { ping(i + 1); }, 1200);
          });
        }
        ping(0);
      });
    })();
  </script>

  <div class="game">
    <div class="castle-bg" id="castle-bg" aria-hidden="true"></div>

    <!-- ── панель персонажа: уровень, имя, опыт / PvP-опыт, медь ────── -->
    <header class="hud-top">
      <div class="player-plate">
        <div class="pp-level-holder">
          <div class="pp-level" id="pp-level">15</div>
          <span class="pp-level-cap" aria-hidden="true">УР.</span>
        </div>
        <div class="pp-main">
          <div class="pp-name" id="pp-name">ИгрокА</div>
          <div class="pp-meter pp-meter-xp" title="Опыт">
            <span class="pp-meter-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.7 6.1 6.6.6-5 4.4 1.5 6.5L12 17.1 6.2 20.6l1.5-6.5-5-4.4 6.6-.6z"/></svg>
            </span>
            <div class="pp-bar pp-xp"><div class="pp-fill" id="pp-xp-fill"></div><span class="pp-bar-text" id="pp-xp-text"></span></div>
          </div>
          <div class="pp-meter pp-meter-pvp" title="Доблесть (опыт PvP)">
            <span class="pp-meter-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l7.5 2.8v5.6c0 4.7-3.2 7.9-7.5 10.1-4.3-2.2-7.5-5.4-7.5-10.1V5.3z"/></svg>
            </span>
            <div class="pp-bar pp-pvp"><div class="pp-fill" id="pp-pvp-fill"></div><span class="pp-bar-text" id="pp-pvp-text"></span></div>
          </div>
        </div>
        <div class="pp-money">
          <span class="pp-money-cell" title="Медь"><span class="coin coin-copper"></span><span id="pp-copper">0</span></span>
          <span class="pp-money-cell" title="Серебро"><span class="coin coin-silver"></span><span id="pp-silver">0</span></span>
          <span class="pp-money-cell" title="Золото"><span class="coin coin-gold"></span><span id="pp-gold">0</span></span>
          <span class="pp-money-cell" title="Бриллианты"><span class="gem"></span><span id="pp-diamond">0</span></span>
        </div>
        <button type="button" class="pp-settings" id="pp-settings" title="Настройки" aria-label="Настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- верхнее меню локации: иконки с подписями -->
    <nav class="castle-perimeter" id="castle-perimeter" aria-label="Меню локации">
      <div class="castle-perimeter-side castle-perimeter-left">
        <button type="button" class="menu-icon" data-castle="bag" title="Рюкзак и гардероб">
          <img src="assets/menu/tm-bag.webp" alt="" draggable="false">
          <span class="mi-label">Рюкзак</span>
        </button>
        <button type="button" class="menu-icon" data-castle="mail" title="Почта">
          <img src="assets/menu/tm-mail.webp" alt="" draggable="false">
          <span class="mail-badge hidden" id="mail-badge" aria-label="Непрочитанные письма">0</span>
          <span class="mi-label">Почта</span>
        </button>
      </div>
      <div class="castle-perimeter-side castle-perimeter-right">
        <button type="button" class="menu-icon" data-castle="auction" title="Аукцион">
          <img src="assets/menu/tm-auction.webp" alt="" draggable="false">
          <span class="mi-label">Аукцион</span>
        </button>
        <button type="button" class="menu-icon" data-castle="battles" title="Идущие бои в локации — вмешаться или посмотреть">
          <img src="assets/menu/tm-battle.webp" alt="" draggable="false">
          <span class="mi-label">Текущие бои</span>
        </button>
      </div>
    </nav>

    <!-- ── середина: главная панель (страница симметрична) ──────────── -->
    <div class="game-mid">

      <main class="main-panel">

        <!-- экран локации (вне боя) -->
        <section class="screen screen-location" id="screen-location">
          <div class="loc-body" id="loc-body">
            <div class="loc-scene-head">
              <span class="loc-scene-title" id="loc-scene-title"></span>
              <button type="button" class="loc-scene-close" id="loc-scene-close" title="Закрыть">✕</button>
            </div>
            <div class="loc-actions" id="loc-actions"></div>
          </div>
          <div class="loc-body battles-body" id="battles-body">
            <div class="loc-scene-head">
              <span class="loc-scene-title">Текущие бои</span>
              <button type="button" class="loc-scene-close" id="battles-close" title="Закрыть">✕</button>
            </div>
            <div class="battles-list" id="battles-list"></div>
          </div>
        </section>

        <!-- экран боя: шапка · сцена · слоты · нижняя зона (слоты только здесь) -->
        <section class="screen screen-battle hidden" id="screen-battle">
          <div class="battle-head" id="battle-head"></div>

          <!-- сцена: 3D-бойцы стоят на круге фона + боевой круг по центру -->
          <div class="arena-stage" id="arena-stage">
            <div class="arena-loading hidden" id="arena-loading">
              <div class="arena-loading-spinner"></div>
              Загрузка бойцов…
            </div>
            <!-- нижняя боевая панель: 3 заклинания + 6 эликсиров. Эликсиры
                 листаются стрелками, если не помещаются по ширине экрана. -->
            <div class="combat-bar hidden" id="combat-bar">
              <div class="combat-slots cb-spells" id="spell-slots" role="group" aria-label="Заклинания"></div>
              <div class="combat-divider" aria-hidden="true"></div>
              <div class="cb-elixirs" role="group" aria-label="Эликсиры">
                <button type="button" class="combat-page cb-arrow cb-prev" id="elixir-prev" aria-label="Предыдущие эликсиры">‹</button>
                <div class="cb-elixirs-view">
                  <div class="combat-slots cb-track" id="elixir-slots"></div>
                </div>
                <button type="button" class="combat-page cb-arrow cb-next" id="elixir-next" aria-label="Следующие эликсиры">›</button>
              </div>
            </div>
          </div>

          <!-- нижний прямоугольник: над ним всплывают окна (участники/лог/чат) -->
          <div class="battle-foreground" id="battle-foreground" aria-hidden="true"></div>
        </section>

      </main>

    </div>

    <!-- низ первой локации: панель (участники/чат) + основное меню -->
    <div class="castle-bottom" id="castle-bottom">
      <section class="bottom-dock" id="bottom-dock">
        <div class="dock-grip" id="dock-grip" title="Потяните вверх, чтобы расширить"><span></span></div>
        <div class="dock-body">

          <div class="dock-pane" id="pane-members">
            <!-- составы команд — сверху (основная область) -->
            <div class="members-grid hide-dead" id="members-grid">
              <div class="team team-ally">
                <div class="team-title">Союзники</div>
                <div class="team-list" id="team-left"></div>
              </div>
              <div class="team team-enemy">
                <div class="team-title">Противники</div>
                <div class="team-list" id="team-right"></div>
              </div>
            </div>
            <!-- инструменты — снизу: поиск по нику, сортировка по HP/энергии, показ
                 убитых. Кнопки/инпут не запускают перетаскивание окна. -->
            <div class="members-tools">
              <!-- поиск спрятан за лупой: тап по лупе разворачивает поле (#6.1) -->
              <button class="mtool-btn mtool-search-toggle" id="members-search-toggle" type="button"
                      title="Поиск по нику" aria-label="Поиск по нику">
                <svg class="mtool-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
              </button>
              <input class="members-search hidden" id="members-search" type="text"
                     placeholder="Поиск по нику…" autocomplete="off" maxlength="24">
              <button class="mtool-btn mtool-actions-start" id="sort-hp" type="button" title="Сортировать по здоровью">
                <span class="mtool-ico hp">♥</span><span class="mtool-dir" aria-hidden="true"></span>
              </button>
              <button class="mtool-btn" id="sort-en" type="button" title="Сортировать по энергии">
                <span class="mtool-ico en">⚡</span><span class="mtool-dir" aria-hidden="true"></span>
              </button>
              <button class="mtool-btn" id="show-dead" type="button" title="Показать убитых">☠</button>
            </div>
          </div>

          <div class="dock-pane" id="pane-battlelog">
            <div class="battle-log" id="battle-log" aria-live="polite"></div>
          </div>

          <div class="dock-pane" id="pane-chat">
            <div class="chat-tabs" id="chat-tabs">
              <button class="chat-tab active" data-chat="common">Общий</button>
              <button class="chat-tab" data-chat="clan">Клановый</button>
            </div>
            <div class="chat-log" id="chat-log"></div>
            <div class="chat-personal-bar hidden" id="chat-personal-bar">
              <span class="cpb-label">Личное →</span>
              <span class="cpb-name" id="cpb-name"></span>
              <button type="button" class="cpb-clear" id="cpb-clear" title="Отменить">✕</button>
            </div>
            <form class="chat-input-row" id="chat-form">
              <input class="chat-input" id="chat-input" type="text"
                     placeholder="Введите сообщение…" autocomplete="off" maxlength="200">
              <button class="chat-send" type="submit">Отправить</button>
            </form>
          </div>

          <div class="dock-pane" id="pane-players">
            <div class="players-list" id="players-list"></div>
          </div>

        </div>
      </section>

      <nav class="castle-main-menu" id="castle-main-menu" aria-label="Основное меню">
        <button type="button" class="sprite-main" data-mm="location" title="Переходы, действия и жители локации">
          <span class="sm-ico"></span><span class="sm-label">Локация</span>
        </button>
        <button type="button" class="sprite-main" data-mm="chat" title="Чат локации">
          <span class="sm-ico"></span><span class="sm-label">Чат</span>
        </button>
        <button type="button" class="sprite-main" data-mm="players" title="Список игроков в локации">
          <span class="sm-ico"></span><span class="sm-label">Игроки</span>
        </button>
        <button type="button" class="sprite-main" data-mm="battlelog" title="Журнал боя">
          <span class="sm-ico"></span><span class="sm-label">Лог боя</span>
        </button>
        <button type="button" class="sprite-main" data-mm="members" title="Участники боя">
          <span class="sm-ico"></span><span class="sm-label">Участники</span>
        </button>
        <button type="button" class="sprite-main" data-mm="clan" title="Клан">
          <span class="sm-ico"></span><span class="sm-label">Клан</span>
        </button>
      </nav>
    </div>

  </div>

  <!-- строка сети: пинг + полоска загрузки (видна в полноэкранном Telegram,
       по центру между кнопками «Закрыть» и «свернуть») -->
  <div class="net-status" id="net-status" aria-hidden="true">
    <span class="net-ping" title="Пинг до сервера">
      <span class="net-dot" id="net-dot"></span><span id="net-ping-val">—</span>
    </span>
    <div class="net-loadbar" id="net-loadbar"><div class="net-loadbar-fill"></div></div>
  </div>

  <!-- гардероб (примерочная) -->
  <div class="dressing hidden" id="dressing">
    <div class="dressing-card">
      <div class="dressing-head">
        <span class="dressing-title">🎒 Гардероб</span>
        <span style="flex:1"></span>
        <button class="dressing-close" id="dressing-close">✕</button>
      </div>
      <div class="dressing-body">
        <!-- «кукла»: слоты экипировки колонками вокруг 3D-окна -->
        <div class="doll">
          <div class="doll-side" id="doll-left"></div>
          <div class="doll-center">
            <div class="dressing-view" id="dressing-view">
              <div class="dressing-hint">⟲ потяните, чтобы повернуть</div>
              <div class="doll-level" id="doll-level" title="Уровень персонажа">1</div>
              <div class="doll-zoom">
                <button class="doll-zoom-btn" id="doll-zoom-out" title="Отдалить">−</button>
                <button class="doll-zoom-btn" id="doll-zoom-in" title="Приблизить">+</button>
              </div>
            </div>
            <!-- пояс эликсиров: ячейки заполняются из рюкзака (renderDressingBelt) -->
            <div class="dressing-belt" id="dressing-belt"></div>
          </div>
          <div class="doll-side" id="doll-right"></div>
        </div>
        <div class="dressing-items" id="dressing-items"></div>
      </div>
    </div>
  </div>

  <!-- настройки игры (шестерёнка в шапке) -->
  <div class="settings hidden" id="settings">
    <div class="settings-card">
      <div class="settings-head">
        <span class="settings-title">⚙ Настройки</span>
        <button class="dressing-close" id="settings-close" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="settings-body">
        <label class="settings-row" for="set-fullscreen">
          <span class="settings-row-main">
            <span class="settings-row-name">Полноэкранный режим</span>
            <span class="settings-row-desc">Игра на весь экран Telegram</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-fullscreen" checked>
            <span class="switch-track"><span class="switch-knob"></span></span>
          </span>
        </label>
        <label class="settings-row" for="set-hints">
          <span class="settings-row-main">
            <span class="settings-row-name">Подсказки в бою</span>
            <span class="settings-row-desc">Подсвечивать синим, куда нажать (щит/удар)</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-hints" checked>
            <span class="switch-track"><span class="switch-knob"></span></span>
          </span>
        </label>
        <label class="settings-row" for="set-members-start">
          <span class="settings-row-main">
            <span class="settings-row-name">Участники при старте боя</span>
            <span class="settings-row-desc">Открывать окно «Участники» в начале боя</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-members-start" checked>
            <span class="switch-track"><span class="switch-knob"></span></span>
          </span>
        </label>
        <button class="settings-action" id="settings-refresh" type="button">
          <span class="settings-action-name">Обновить игру</span>
          <span class="settings-action-desc">Сбросить кэш и загрузить свежую версию</span>
        </button>
        <button class="settings-exit" id="settings-exit" type="button">Выйти из игры</button>
      </div>
    </div>
  </div>

  <!-- окно информации о бое (открывается ссылкой «Бой #N» из чата) -->
  <div class="binfo hidden" id="binfo">
    <div class="binfo-card">
      <div class="dressing-head">
        <span class="dressing-title" id="binfo-title">Бой</span>
        <span style="flex:1"></span>
        <button class="binfo-copy" id="binfo-copy" type="button" title="Скопировать ссылку на бой">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1Z"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span>Ссылка</span>
        </button>
        <button class="dressing-close" id="binfo-close">✕</button>
      </div>
      <div class="binfo-body" id="binfo-body"></div>
    </div>
  </div>

  <!-- Почта: список писем · чтение · отправка -->
  <div class="mail hidden" id="mail">
    <div class="mail-card">
      <div class="dressing-head">
        <span class="dressing-title" id="mail-title">Почта</span>
        <span style="flex:1"></span>
        <button class="mail-compose-btn" id="mail-compose" type="button" title="Написать письмо">✉ Написать</button>
        <button class="dressing-close" id="mail-close">✕</button>
      </div>
      <div class="mail-body" id="mail-body"></div>
    </div>
  </div>

  <!-- Меню по тапу на ник игрока -->
  <div class="nickmenu hidden" id="nickmenu">
    <div class="nickmenu-pop" id="nickmenu-pop">
      <div class="nickmenu-head" id="nickmenu-head"></div>
      <button type="button" class="nickmenu-item" data-act="private">Приватное сообщение</button>
      <button type="button" class="nickmenu-item" data-act="personal">Личное в общий чат</button>
      <button type="button" class="nickmenu-item" data-act="copy">Скопировать ник</button>
      <button type="button" class="nickmenu-item" data-act="info">Информация</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    // Ручной выбор сервера перед стартом игры: локальный (start.bat + Docker)
    // или Azure. Игра (js/main.js) загружается только после выбора —
    // js/net/net.js прочитает window.API_URL. Под file:// экран не нужен:
    // там игра не стартует, работает помощник выше.
    const SERVERS = {
      local: { url: 'http://localhost:8080',          name: 'Локальный сервер', desc: 'Docker на этом компьютере (localhost:8080)' },
      azure: { url: 'https://4.231.90.10.sslip.io',   name: 'Сервер Azure',     desc: 'Облако — общий мир для всех игроков' },
    };

    function chooseServer() {
      if (location.protocol === 'file:') return Promise.resolve(null);
      // внутри Telegram Mini App выбора нет: всегда боевой сервер (Azure)
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initData) {
        if (tg.expand) tg.expand();
        return Promise.resolve(SERVERS.azure.url);
      }
      // подсказка по умолчанию: с внешнего хостинга (GitHub Pages) — Azure
      const hinted = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)
        ? 'local' : 'azure';
      return new Promise((resolve) => {
        const el = document.createElement('div');
        el.className = 'file-helper';
        el.innerHTML =
          '<div class="fh-card">' +
            '<div class="fh-title">⚜ DRAGON ARENA</div>' +
            '<p class="fh-sub">Выберите сервер для игры</p>' +
            '<div class="srv-list">' +
              Object.entries(SERVERS).map(([id, s]) =>
                '<button class="srv-btn' + (id === hinted ? ' srv-hint' : '') + '" data-srv="' + id + '">' +
                  '<span class="srv-name">' + s.name + (id === hinted ? ' · рекомендуется' : '') + '</span>' +
                  '<span class="srv-desc">' + s.desc + '</span>' +
                '</button>').join('') +
            '</div>' +
          '</div>';
        el.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-srv]');
          if (!btn) return;
          el.remove();
          resolve(SERVERS[btn.dataset.srv].url);
        });
        document.body.appendChild(el);
      });
    }

    const bootStatus = document.getElementById('boot-status');
    window.setBootStatus = (text) => { if (bootStatus) bootStatus.textContent = text; };
    window.finishBoot = () => {
      document.body.classList.remove('booting');
      document.getElementById('boot-screen')?.remove();
    };

    const url = await chooseServer();
    if (url) window.API_URL = url;
    window.setBootStatus('Подключение к серверу…');
    await import('./js/main.js');
  </script>
</body>
</html>
